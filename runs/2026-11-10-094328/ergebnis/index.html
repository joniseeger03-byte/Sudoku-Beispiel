<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="tafel">
  <header class="kopf">
    <div class="kopfzeile">
      <h1>Sudoku</h1>
      <span id="status" class="status" role="status" aria-live="polite">&nbsp;</span>
    </div>
    <div class="stufen" role="group" aria-label="Schwierigkeit">
      <button type="button" data-stufe="leicht">leicht</button>
      <button type="button" data-stufe="mittel" class="aktiv">mittel</button>
      <button type="button" data-stufe="schwer">schwer</button>
    </div>
  </header>

  <div id="brett" class="brett" aria-label="Sudoku-Brett"></div>

  <div class="ziffernfeld" aria-label="Ziffernfeld">
    <button type="button" data-digit="1">1</button>
    <button type="button" data-digit="2">2</button>
    <button type="button" data-digit="3">3</button>
    <button type="button" data-digit="4">4</button>
    <button type="button" data-digit="5">5</button>
    <button type="button" data-digit="6">6</button>
    <button type="button" data-digit="7">7</button>
    <button type="button" data-digit="8">8</button>
    <button type="button" data-digit="9">9</button>
    <button type="button" data-digit="0" aria-label="Löschen">⌫</button>
  </div>
</main>
<script src="board.js"></script>
</body>
</html>
