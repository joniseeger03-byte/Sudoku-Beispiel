<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku – Trockengarten</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="garten">
    <h1 class="titel">Sudoku</h1>

    <nav class="stufen" aria-label="Schwierigkeitsstufe">
      <button type="button" class="stein stufe" data-stufe="leicht">leicht</button>
      <button type="button" class="stein stufe aktiv" data-stufe="mittel">mittel</button>
      <button type="button" class="stein stufe" data-stufe="schwer">schwer</button>
    </nav>

    <div id="brett" class="brett" role="grid" aria-label="Sudoku-Brett"></div>

    <div id="meldung" class="meldung" role="status" aria-live="polite"></div>

    <div class="ziffernfeld" aria-label="Ziffernfeld">
      <button type="button" class="stein ziffer" data-digit="1">1</button>
      <button type="button" class="stein ziffer" data-digit="2">2</button>
      <button type="button" class="stein ziffer" data-digit="3">3</button>
      <button type="button" class="stein ziffer" data-digit="4">4</button>
      <button type="button" class="stein ziffer" data-digit="5">5</button>
      <button type="button" class="stein ziffer" data-digit="6">6</button>
      <button type="button" class="stein ziffer" data-digit="7">7</button>
      <button type="button" class="stein ziffer" data-digit="8">8</button>
      <button type="button" class="stein ziffer" data-digit="9">9</button>
      <button type="button" class="stein ziffer loeschen" data-digit="0" aria-label="Löschen">Löschen</button>
    </div>
  </main>
  <script src="board.js"></script>
</body>
</html>
