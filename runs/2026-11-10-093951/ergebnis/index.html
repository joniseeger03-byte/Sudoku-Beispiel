<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku – Lichtspielhaus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="saeule">
  <header class="titelband">
    <h1>Sudoku</h1>
    <p class="untertitel">Lichtspielhaus</p>
  </header>

  <div class="stufen" role="group" aria-label="Schwierigkeitsstufe">
    <button type="button" class="stufe" data-stufe="leicht">Leicht</button>
    <button type="button" class="stufe aktiv" data-stufe="mittel">Mittel</button>
    <button type="button" class="stufe" data-stufe="schwer">Schwer</button>
  </div>

  <div class="brett-huelle">
    <div id="brett" class="brett" role="grid" aria-label="Sudoku-Brett"></div>
  </div>

  <p id="meldung" class="meldung" role="status" aria-live="polite"></p>
  <p class="bravo" aria-hidden="true">&#9830; Bravo &#9830;</p>

  <div class="ziffernfeld" role="group" aria-label="Ziffernfeld">
    <button type="button" class="ziffer" data-digit="1">1</button>
    <button type="button" class="ziffer" data-digit="2">2</button>
    <button type="button" class="ziffer" data-digit="3">3</button>
    <button type="button" class="ziffer" data-digit="4">4</button>
    <button type="button" class="ziffer" data-digit="5">5</button>
    <button type="button" class="ziffer" data-digit="6">6</button>
    <button type="button" class="ziffer" data-digit="7">7</button>
    <button type="button" class="ziffer" data-digit="8">8</button>
    <button type="button" class="ziffer" data-digit="9">9</button>
    <button type="button" class="ziffer loeschen" data-digit="0" aria-label="Löschen">&#10005;</button>
  </div>
</main>
<script src="board.js"></script>
</body>
</html>
