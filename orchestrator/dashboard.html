<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agentenlauf</title>
<style>
:root { --bg:#e9eff5; --panel:#fbfcfe; --ink:#14233b; --muted:#54647b; --line:#c4cfdc; --heavy:#14233b; --accent:#2343c9; --soft:#dfe6fb;
  --ok:#0d7a59; --oksoft:#dcf1e8; --bad:#bd2445; --badsoft:#fbe3e8; --warn:#9a5b00; --warnsoft:#fbecd2; --code:#eef2f7;
  --c1:#2343c9; --c2:#0d7a59; --c3:#9a5b00; --c4:#7a3fb0; --c5:#bd2445; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1623; --panel:#172132; --ink:#e7edf6; --muted:#9eaec4; --line:#33445c; --heavy:#aebdd2; --accent:#93a9ff; --soft:#24335f;
  --ok:#5ad2aa; --oksoft:#173d33; --bad:#ff8fa5; --badsoft:#4b1d2a; --warn:#f2bb63; --warnsoft:#463414; --code:#111a28;
  --c1:#93a9ff; --c2:#5ad2aa; --c3:#f2bb63; --c4:#c9a0ff; --c5:#ff8fa5; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
button, select { font: inherit; color: inherit; }
code, pre, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
.wrap { max-width: 1560px; margin: auto; padding: 20px 16px 16px; display: grid; gap: 18px; }

/* Kopf */
.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.8rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.badge { font-size: .78rem; font-weight: 600; padding: 3px 8px; border-radius: 4px; }
.badge.live { background: var(--soft); color: var(--accent); }
.badge.demo { background: var(--warnsoft); color: var(--warn); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1.5px solid var(--heavy); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 6px 12px; cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--panel); }
select, a.btn, button.btn { background: var(--panel); border: 1.5px solid var(--heavy); border-radius: 6px; padding: 6px 10px; text-decoration: none; cursor: pointer; }
a.btn.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.startline { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: .9rem; color: var(--muted); }
.cmd { background: var(--ink); color: var(--panel); padding: 4px 10px; border-radius: 4px; font-size: .85rem; }
.cmd::before { content: "$ "; opacity: .6; }
.runstate { font-weight: 600; }
.runstate.run { color: var(--accent); } .runstate.ok { color: var(--ok); } .runstate.fail { color: var(--bad); } .runstate.wait { color: var(--warn); }

/* Teil 2: Graph */
.graphbox { background: var(--panel); border: 2px solid var(--heavy); border-radius: 6px; overflow-x: auto; }
#graph { display: block; min-width: 900px; width: 100%; height: auto; }
#graph .band { fill: var(--bg); } #graph .band.alt { fill: var(--panel); }
#graph .bandlabel { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
#graph .edge { fill: none; stroke: var(--line); stroke-width: 1.6; }
#graph .edge.on { stroke: var(--heavy); stroke-width: 2; }
#graph .edge.loop { stroke-dasharray: 5 4; }
#graph .edge.loop.on { stroke: var(--warn); stroke-width: 3.5; }
#graph .elabel { font-size: 12.5px; fill: var(--muted); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
#graph .elabel.on { fill: var(--ink); font-weight: 600; }
#graph .elabel.loop.on { fill: var(--warn); }
#graph .node { cursor: pointer; }
#graph .node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
#graph .node.s-run rect { fill: var(--soft); stroke: var(--accent); stroke-width: 2.5; animation: pulse 1.2s ease-in-out infinite; }
#graph .node.s-ok rect { fill: var(--oksoft); stroke: var(--ok); }
#graph .node.s-fail rect { fill: var(--badsoft); stroke: var(--bad); }
#graph .node.sel rect { stroke: var(--ink); stroke-width: 3; }
#graph .node .t { font-size: 15.5px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
#graph .node rect.rbadge { fill: var(--warn); stroke: none; animation: none; } #graph .rbadge-t { fill: var(--panel); font-size: 10px; font-weight: 700; }
@keyframes pulse { 50% { stroke-opacity: .35; } }
@media (prefers-reduced-motion: reduce) { #graph .node.s-run rect { animation: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--heavy); vertical-align: middle; margin-right: 6px; }
.legend i.loop { border-top: 2px dashed var(--warn); }

/* Teil 2: Live-Wand */
.wallhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.wallhead h2, .panelhead h2, .loghead h2 { margin: 0; font-size: 1rem; }
.hint { font-size: .82rem; color: var(--muted); }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1.5px solid var(--line); border-radius: 6px; min-width: 0; cursor: pointer; display: flex; flex-direction: column; }
.card.run { border-color: var(--accent); }
.card.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.card header { padding: 6px 10px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; }
.card header b { white-space: nowrap; } .card header span { color: var(--muted); font-size: .75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card pre { margin: 0; padding: 8px 10px; height: 170px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .74rem; line-height: 1.4; }
.card.done pre { opacity: .7; }

/* Detail-Panel */
.panel { background: var(--panel); border: 2px solid var(--heavy); border-radius: 6px; min-width: 0; }
.panelhead { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1.5px solid var(--heavy); }
.panelhead .who { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.panelhead .sub { font-size: .82rem; color: var(--muted); }
.chip { font-size: .75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); }
.chip.run { color: var(--accent); border-color: var(--accent); } .chip.ok { color: var(--ok); border-color: var(--ok); } .chip.fail { color: var(--bad); border-color: var(--bad); }
.rounds { display: flex; gap: 4px; flex-wrap: wrap; }
.rounds button { font-size: .75rem; padding: 2px 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 4px; cursor: pointer; }
.rounds button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.panelbody { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.panelbody > div { min-width: 0; }
.panelbody > div:first-child { border-right: 1.5px solid var(--heavy); }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; color: var(--muted); font-size: .88rem; }
.tabs button.on { background: var(--ink); color: var(--panel); }
.tabs .lbl { margin-left: auto; align-self: center; font-size: .75rem; color: var(--muted); padding-right: 6px; }
.pane { padding: 14px; height: 470px; overflow: auto; }
.pane.out { font-size: .92rem; }
.pane pre.raw { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .82rem; line-height: 1.5; }
.filehead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 8px; font-size: .85rem; }
.filehead code { font-weight: 600; }
.box { background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; }
.note { font-size: .85rem; color: var(--muted); margin: 0 0 10px; }
.note.warn { color: var(--warn); }
.compose { display: flex; height: 22px; border-radius: 4px; overflow: hidden; margin: 6px 0 4px; border: 1px solid var(--line); }
.compose span { min-width: 3px; }
.ctx { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.ctx details { border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.ctx summary { cursor: pointer; padding: 6px 10px; display: flex; gap: 8px; align-items: center; font-size: .86rem; }
.ctx summary .dot { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.ctx summary .sz { margin-left: auto; color: var(--muted); font-size: .76rem; white-space: nowrap; }
.ctx pre { margin: 0; padding: 8px 10px; max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .76rem; border-top: 1px solid var(--line); }
.hl { list-style: none; margin: 0; padding: 0; }
.hl li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .87rem; display: grid; grid-template-columns: 4.6em minmax(0,1fr); gap: 2px 8px; }
.hl time { color: var(--muted); font-size: .78rem; }
.hl code { grid-column: 2; font-size: .76rem; background: var(--code); padding: 2px 6px; border-radius: 3px; overflow-wrap: anywhere; justify-self: start; }
.hl .kante { color: var(--warn); font-weight: 600; }
.empty { color: var(--muted); }
@media (max-width: 860px) { .panelbody { grid-template-columns: minmax(0, 1fr); } .panelbody > div:first-child { border-right: 0; border-bottom: 1.5px solid var(--heavy); } .pane { height: 380px; } }

/* Markdown */
.md h1 { font-size: 1.3rem; margin: 0 0 10px; } .md h2 { font-size: 1.05rem; margin: 16px 0 6px; } .md h3 { font-size: .95rem; margin: 12px 0 4px; }
.md p, .md ul, .md ol, .md pre { margin: 0 0 10px; }
.md code { font-size: .86em; background: var(--soft); padding: 1px 4px; border-radius: 3px; }
.md pre { background: var(--code); padding: 10px; overflow-x: auto; font-size: .8rem; } .md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; width: 100%; font-size: .88rem; margin-bottom: 10px; }
.md th, .md td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }

/* Protokoll */
.loghead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.log { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; border-top: 1.5px solid var(--heavy); font-size: .88rem; background: var(--panel); }
.log li { display: grid; grid-template-columns: 5.2em 8.5em minmax(0,1fr) minmax(0,16em); gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--line); }
.log time { color: var(--muted); font-size: .8rem; }
.log b { font-weight: 600; } .log .fail { color: var(--bad); } .log .harness { color: var(--muted); } .log .kante { color: var(--warn); font-weight: 600; }
.log .detail { color: var(--muted); font-size: .74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 760px) { .log li { grid-template-columns: 4.6em minmax(0,1fr); } .log .detail, .log li > b { display: none; } }
/* Teil 2: Zeitleiste */
.tl { background: var(--panel); border: 1.5px solid var(--line); border-radius: 6px; padding: 8px 12px 10px; }
.tlrow { display: grid; grid-template-columns: 10.5em minmax(0, 1fr); gap: 10px; align-items: center; min-height: 26px; cursor: pointer; }
.tlrow:hover .tlname { color: var(--accent); }
.tlrow.sel .tlname { font-weight: 700; }
.tlname { font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tlname small { color: var(--muted); }
.track { position: relative; height: 20px; }
.bar { position: absolute; top: 2px; height: 16px; border-radius: 3px; min-width: 3px; background: var(--ok); color: var(--panel); font-size: .68rem; line-height: 16px; padding: 0 5px; white-space: nowrap; overflow: hidden; }
.bar.run { background: var(--accent); background-image: repeating-linear-gradient(45deg, transparent 0 6px, rgba(255,255,255,.22) 6px 12px); }
.bar.fail { background: var(--bad); } .bar.skript { background: var(--muted); } .bar.skript.fail { background: var(--bad); }
.axis { position: relative; height: 18px; margin-left: calc(10.5em + 10px); border-top: 1px solid var(--line); margin-top: 4px; }
.axis span { position: absolute; top: 2px; font-size: .68rem; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
.barlbl { position: absolute; top: 2px; font-size: .7rem; line-height: 16px; color: var(--muted); white-space: nowrap; }
.barlbl.left { transform: translateX(-100%); }
.log .warn, .hl .warn { color: var(--warn); font-weight: 600; }
.log .warn::before, .hl .warn::before { content: "\26A0  "; }
#graph .warnmark { fill: var(--warn); } #graph .warnmark-t { fill: var(--panel); font-size: 11px; font-weight: 800; }
/* Vorführung: Bausteine, Erklärungen, Aufklappbares */
.zustand { font-size: .9rem; }
.laufbox { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--panel); border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.flow { display: grid; grid-template-columns: minmax(0,2fr) auto minmax(0,2fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,2fr); gap: 8px; align-items: stretch; padding: 14px; border-bottom: 1.5px solid var(--heavy); }
.flow .op { align-self: center; font-size: 1.6rem; color: var(--muted); padding: 0 2px; }
.flow button { background: var(--bg); border: 2px solid var(--line); border-radius: 8px; padding: 18px 12px; text-align: center; cursor: pointer; min-width: 0; }
.flow button:hover { border-color: var(--heavy); }
.flow button.on { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.flow b { display: block; font-size: 1.7rem; line-height: 1.2; }
.flow button.klein b { font-size: 1.1rem; }
.flow button.leer { opacity: .5; }
.erkl { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.erkl .kern { display: flex; gap: 16px; justify-content: space-between; align-items: center; font-size: 1.25rem; }
.info { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--heavy); background: none; color: inherit; font: italic 700 1.15rem Georgia, serif; cursor: pointer; flex: none; }
.info.offen { background: var(--ink); color: var(--panel); font-style: normal; }
.erkl .wert { margin: 10px 0 0; font-weight: 600; }
.erkl ul { margin: 8px 0 0; padding-left: 20px; }
.erkl li { margin: 4px 0; }
.pfad { margin: 0; padding: 8px 16px 0; font-size: .82rem; color: var(--muted); }
#panel { display: flex; flex-direction: column; height: calc(100vh - 100px); min-height: 480px; }
body.teil2 #panel { height: calc(100vh - 190px); }
#panel .pane { flex: 1; height: auto; min-height: 0; }
.haken { list-style: none; margin: 0 0 14px; padding: 0; font-size: 1.1rem; }
.haken li { padding: 6px 0; }
.haken li::before { content: "\2713"; color: var(--ok); font-weight: 700; margin-right: 10px; }
.haken li.warn { color: var(--warn); } .haken li.warn::before { content: "\26A0"; color: var(--warn); }
.haken li.kante { color: var(--warn); } .haken li.kante::before { content: "\2192"; color: var(--warn); }
.v2kopf { display: flex; gap: 12px; align-items: flex-start; }
.v2kopf .konzept { flex: 1; min-width: 0; }
#ansicht { flex: none; padding-top: 10px; }
#protokoll { flex-basis: 100%; }
.pane pre.raw { font-size: .92rem; }
.fakten { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 6px 18px; margin: 0 0 14px; }
.fakten dt { color: var(--muted); } .fakten dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
details.tech > summary, details.mehr > summary { cursor: pointer; color: var(--accent); }
details.tech[open] > summary { margin-bottom: 10px; }
details.mehr { background: var(--panel); border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 14px; }
details.mehr[open] > summary { margin-bottom: 10px; }
.konzept { border-bottom: 0; padding-left: 0; }
.unter { margin-top: 10px; }
@media (max-width: 860px) { .flow { grid-template-columns: minmax(0,1fr); } .flow .op { display: none; } }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Sudoku-Agenten</h1>
    <div class="controls">
      <span class="zustand" id="zustand"></span>
      <div class="seg" role="group" aria-label="Ansicht">
        <button id="t1">Teil 1 · Ein Agent</button>
        <button id="t2">Teil 2 · Loop und Graph</button>
      </div>
      <a class="btn primary" id="play" hidden target="_blank" rel="noopener">Ergebnis spielen</a>
      <button class="btn" id="mehr" aria-expanded="false">Lauf ▾</button>
    </div>
  </div>
  <div class="laufbox" id="laufbox" hidden>
    <span class="badge" id="modus" hidden></span>
    <select id="run" aria-label="Lauf wählen"></select>
    <label>Agent in Teil 1 <select id="agent"></select></label>
    <button class="btn" id="follow">Live folgen</button>
    <div class="startline" id="startline"></div>
    <details class="mehr" id="protokoll">
      <summary>Protokoll: jeder Schritt dieses Laufs</summary>
      <ol class="log" id="log"></ol>
    </details>
  </div>

  <section id="v2" hidden>
    <div class="v2kopf">
      <div class="konzept erkl" id="konzept"></div>
      <div class="controls" id="ansicht">
        <button class="btn" data-a="graph">← Graph</button><button class="btn" data-a="zeit">Zeitleiste</button><button class="btn" data-a="live">Live</button>
      </div>
    </div>
    <div class="graphbox unter" id="graphbox">
      <svg id="graph" role="img" aria-label="Ablauf als Graph"></svg>
    </div>
    <div class="unter" id="tlbox" hidden>
      <div class="wallhead"><h2>Zeitleiste</h2><span class="hint">Übereinander = gleichzeitig</span></div>
      <div class="tl" id="tl"></div>
    </div>
    <div class="unter" id="wallbox" hidden>
      <div class="wallhead"><h2 id="wallTitle">Live</h2><span class="hint" id="wallHint"></span></div>
      <div class="wall" id="wall"></div>
    </div>
  </section>

  <section class="panel" id="panel">
    <div class="panelhead"><div class="who" id="who"></div><div class="rounds" id="rounds"></div></div>
    <div class="flow" id="tabs"></div>
    <div class="erkl" id="erkl"></div>
    <p class="pfad" id="outlbl" hidden></p>
    <div class="pane" id="left"></div>
    <div class="pane out" id="out" hidden></div>
  </section>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inline = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
function md(src) {
  const L = (src || '').trim().split(/\r?\n/), o = [];
  for (let i = 0; i < L.length;) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith('```')) { const c = []; for (i++; i < L.length && !L[i].startsWith('```'); i++) c.push(L[i]); i++; o.push(`<pre><code>${esc(c.join('\n'))}</code></pre>`); }
    else if (/^#{1,6} /.test(l)) { const n = Math.min(l.indexOf(' '), 3); o.push(`<h${n}>${inline(l.replace(/^#+ /,''))}</h${n}>`); i++; }
    else if (l.startsWith('|')) { const r = []; for (; i < L.length && L[i].startsWith('|'); i++) r.push(L[i].replace(/^\||\|\s*$/g,'').split('|').map(c => c.trim())); o.push('<table><thead><tr>' + r[0].map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' + r.slice(2).map(x => '<tr>' + x.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>'); }
    else if (/^(\s*[-*] |\d+\. )/.test(l)) { const t = /^\d/.test(l) ? 'ol' : 'ul', it = []; for (; i < L.length && /^(\s*[-*] |\d+\. )/.test(L[i]); i++) it.push(`<li>${inline(L[i].replace(/^(\s*[-*] |\d+\. )/,''))}</li>`); o.push(`<${t}>${it.join('')}</${t}>`); }
    else { const p = []; for (; i < L.length && L[i].trim() && !/^(#|\||\s*[-*] |\d+\. |```)/.test(L[i]); i++) p.push(inline(L[i])); if (!p.length) { p.push(inline(L[i])); i++; } o.push(`<p>${p.join('<br>')}</p>`); }
  }
  return o.join('');
}
const LABEL = { wait: 'wartet', run: 'läuft', ok: 'fertig', fail: 'Fehler' };
const ART = { modell: 'Sprachmodell', agent: 'Agent mit Werkzeugen', skript: 'Skript, kein Modell', mensch: 'Du' };
const KI = a => a === 'modell' || a === 'agent';
const SKRIPTE = ['gate', 'abnahme'];
const COLORS = ['var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)'];
const kb = n => n >= 1000 ? (n / 1000).toFixed(1).replace('.', ',') + ' k' : String(n);

let G = null, D = null, current = null, follow = true;
let teil = location.hash === '#teil2' ? 2 : 1, tab = 'prompt';
let selK = null, selA = null;   // gewählter Knoten und (optional) fester Aufruf
const records = {};              // volle Aufruf-Daten (Prompt, Kontext), unveränderlich
let ansicht = 'graph', erklaert = null, agent1 = 'engine';

// ---------------------------------------------------------------- Ableitungen aus den Events
const known = e => G.knoten[e.knoten];
function stateOf(k) { let s = 'wait'; for (const e of D.events) if (e.knoten === k && LABEL[e.status]) s = e.status; return s; }
function callsOf(k) { return Object.values(D.aufrufe).filter(a => a.knoten === k).sort((a, b) => a.id.localeCompare(b.id)); }
function phaseOf(k) { return G.knoten[k].phase; }
function phaseNodes(p) { return Object.keys(G.knoten).filter(k => phaseOf(k) === p); }
function phaseTitle(p) { return (G.phasen.find(x => x.id === p) || {}).titel || p; }
function rounds(k) { return SKRIPTE.includes(k) ? D.events.filter(e => e.knoten === k && e.status === 'run').length : callsOf(k).length; }
function kantenCount(a, b) { return D.events.filter(e => e.status === 'kante' && e.von === a && e.nach === b).length; }
function runState() {
  const last = D.events[D.events.length - 1];
  if (!last) return ['run', 'startet'];
  if (last.knoten === 'orchestrator') return ['fail', last.text];
  if (last.knoten === 'freigabe' && last.status === 'run') return ['wait', 'wartet auf deine Freigabe'];
  if (last.knoten === 'freigabe' && last.status === 'ok') return ['ok', 'freigegeben, in main'];
  return ['run', 'läuft'];
}
function autoSelect() {
  const ev = D.events.filter(e => known(e) && LABEL[e.status]);
  if (!ev.length) return;
  if (selK && stateOf(selK) === 'run') return;            // aktueller Agent arbeitet noch: bleiben
  // Arbeitet niemand (mehr), zeigen wir den letzten Agenten. Auf „Freigabe“ gäbe es nichts zu erklären.
  const running = ev.filter(e => e.status === 'run' && stateOf(e.knoten) === 'run' && G.knoten[e.knoten].art !== 'mensch');
  const agenten = ev.filter(e => KI(G.knoten[e.knoten].art));
  selK = (running.length ? running[running.length - 1] : agenten.length ? agenten[agenten.length - 1] : ev[ev.length - 1]).knoten;
  selA = null;
}
function modelLabel(k) {
  const a = callsOf(k).pop(); if (a) return `${a.anbieter} · ${a.modell}`;
  const r = (D.start.rollen || {})[k]; return r ? `${r.anbieter} · ${r.modell}` : '';
}
// Tokens grob geschätzt: etwa 4 Zeichen pro Token
const tokIn = a => Math.round(((a.prompt_zeichen || 0) + (a.kontext || []).reduce((n, c) => n + c.zeichen, 0)) / 4);
const tokOut = a => Math.round((a.antwort_zeichen || (D.live[a.id] || '').length) / 4);
const warned = k => D.events.some(e => e.knoten === k && e.warnung);
function tsec(e) {
  if (e.t) return e.t;
  const d = new Date(D.start.zeit || Date.now()), [h, m, s] = e.zeit.split(':').map(Number);
  d.setHours(h, m, s, 0); return d.getTime() / 1000;
}

// ---------------------------------------------------------------- Teil 2: Graph
const C = { colw: 146, nw: 114, nh: 62, rowh: 104, x0: 14, y0: 22 };
function P(k) { const [c, r] = G.knoten[k].pos; return { x: C.x0 + c * C.colw, y: C.y0 + r * C.rowh, c, r }; }
function edgeGeom(a, b) {
  const A = P(a), B = P(b); let p;
  if (B.c > A.c) { const x1 = A.x + C.nw, y1 = A.y + C.nh / 2, x2 = B.x, y2 = B.y + C.nh / 2, dx = (x2 - x1) / 2; p = [[x1, y1], [x1 + dx, y1], [x2 - dx, y2], [x2, y2]]; }
  else if (B.c === A.c) { const x = A.x + C.nw * .35, up = B.r < A.r, y1 = up ? A.y : A.y + C.nh, y2 = up ? B.y + C.nh : B.y; p = [[x, y1], [x, y1], [x, y2], [x, y2]]; }
  else if (B.r !== A.r) { const up = B.r < A.r, x1 = A.x + C.nw / 2, y1 = up ? A.y : A.y + C.nh, x2 = B.x + C.nw * .75, y2 = up ? B.y + C.nh : B.y, m = (y1 + y2) / 2; p = [[x1, y1], [x1, m], [x2, m], [x2, y2]]; }
  else { const x1 = A.x + C.nw / 2, x2 = B.x + C.nw / 2, y = A.y + C.nh, cy = y + 30 + 22 * (A.c - B.c); p = [[x1, y], [x1, cy], [x2, cy], [x2, y]]; }
  const mid = [0, 1].map(i => (p[0][i] + 3 * p[1][i] + 3 * p[2][i] + p[3][i]) / 8);
  return { d: `M${p[0]} C${p[1]} ${p[2]} ${p[3]}`, mid };
}
function renderGraph() {
  const cols = Math.max(...Object.values(G.knoten).map(k => k.pos[0])) + 1;
  const W = C.x0 * 2 + cols * C.colw - (C.colw - C.nw), H = C.y0 + 2 * C.rowh + C.nh + 70;
  const svg = $('graph'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let out = `<defs>${['idle', 'on', 'loop'].map(n => `<marker id="m-${n}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(${n === 'idle' ? '--line' : n === 'on' ? '--heavy' : '--warn'})"/></marker>`).join('')}</defs>`;
  G.phasen.forEach((ph, i) => {
    const cs = phaseNodes(ph.id).map(k => G.knoten[k].pos[0]);
    const x1 = C.x0 + Math.min(...cs) * C.colw - 9, x2 = C.x0 + Math.max(...cs) * C.colw + C.nw + 9;
    out += `<rect class="band ${i % 2 ? 'alt' : ''}" x="${x1}" y="0" width="${x2 - x1}" height="${H}"/>`;
  });
  for (const e of G.kanten) {
    const g = edgeGeom(e.von, e.nach), n = kantenCount(e.von, e.nach);
    const on = e.art ? n > 0 : (stateOf(e.von) === 'ok' && stateOf(e.nach) !== 'wait');
    const loop = e.art === 'schleife';
    const cls = `${on ? 'on' : ''} ${loop ? 'loop' : ''}`;
    out += `<path class="edge ${cls}" d="${g.d}" marker-end="url(#m-${on ? (loop ? 'loop' : 'on') : 'idle'})"/>`;
    if (e.text) out += `<text class="elabel ${cls}" x="${g.mid[0]}" y="${g.mid[1] - 4}" text-anchor="middle">${esc(e.text)}${loop && n ? ` ×${n}` : ''}</text>`;
  }
  for (const k of Object.keys(G.knoten)) {
    const n = G.knoten[k], p = P(k), s = stateOf(k), r = rounds(k);
    out += `<g class="node s-${s}" data-k="${k}" transform="translate(${p.x},${p.y})"><title>${esc(n.titel)}: ${esc(ART[n.art])}${KI(n.art) ? ` · ${esc(modelLabel(k))}` : ''}</title>
      <rect width="${C.nw}" height="${C.nh}" rx="8"/>
      <text class="t" x="${C.nw / 2}" y="${C.nh / 2 + 5}">${esc(n.titel)}</text>
      ${warned(k) ? `<circle class="warnmark" cx="0" cy="0" r="8"/><text class="warnmark-t" x="0" y="4" text-anchor="middle">!</text>` : ''}
      ${r > 1 ? `<rect class="rbadge" x="${C.nw - 34}" y="-8" width="30" height="16" rx="8"/><text class="rbadge-t" x="${C.nw - 19}" y="4" text-anchor="middle">R${r}</text>` : ''}
    </g>`;
  }
  svg.innerHTML = out;
}

// ---------------------------------------------------------------- Teil 2: Zeitleiste
function spans() {
  const [st] = runState(), last = D.events.length ? tsec(D.events[D.events.length - 1]) : 0;
  const now = st === 'run' ? Math.max(Date.now() / 1000, last) : last;
  const out = Object.values(D.aufrufe).map(a => ({
    k: a.knoten, id: a.id, runde: a.runde, start: a.start, status: a.status, skript: false,
    end: a.dauer != null ? a.start + a.dauer : now,
    text: a.status === 'run' ? `läuft seit ${Math.round(now - a.start)} s` : `${String(a.dauer).replace('.', ',')} s · ≈ ${kb(tokIn(a))} → ${kb(tokOut(a))} Tokens`,
  }));
  for (const k of SKRIPTE) {
    let open = null, n = 0;
    for (const e of D.events.filter(e => e.knoten === k && LABEL[e.status])) {
      if (e.status === 'run') { open = { k, id: k + (++n), runde: n, start: tsec(e), status: 'run', skript: true, end: now, text: 'Tests laufen' }; out.push(open); }
      else if (open) { open.end = Math.max(tsec(e), open.start + .3); open.status = e.status; open.text = e.status === 'ok' ? 'bestanden' : 'nicht bestanden'; open = null; }
    }
  }
  return out.sort((a, b) => a.start - b.start);
}
function renderTimeline() {
  const sp = spans(), tl = $('tl');
  if (!sp.length) { tl.innerHTML = '<p class="empty" style="margin:4px 0">Noch kein Aufruf.</p>'; return; }
  const t0 = Math.min(...sp.map(s => s.start)), t1 = Math.max(...sp.map(s => s.end), t0 + 1), span = t1 - t0;
  const pct = t => ((t - t0) / span * 100).toFixed(2) + '%';
  const step = [5, 10, 15, 30, 60, 120, 300, 600].find(x => span / x <= 8) || 1200;
  const ticks = []; for (let t = 0; t <= span; t += step) ticks.push(t);
  const fmt = t => t >= 60 ? `${Math.floor(t / 60)}:${String(Math.round(t % 60)).padStart(2, '0')} min` : `${t} s`;
  tl.innerHTML = sp.map(s => `<div class="tlrow ${s.k === selK ? 'sel' : ''}" data-k="${s.k}" data-a="${s.skript ? '' : s.id}">
      <span class="tlname">${esc(G.knoten[s.k].titel)}${s.runde > 1 ? ` <small>R${s.runde}</small>` : ''}</span>
      <div class="track"><div class="bar ${s.status} ${s.skript ? 'skript' : ''}" style="left:${pct(s.start)};width:calc(${pct(s.end)} - ${pct(s.start)})" title="${esc(s.text)}"></div>${
        (s.end - t0) / span < .72 ? `<span class="barlbl" style="left:calc(${pct(s.end)} + 6px)">${esc(s.text)}</span>` : `<span class="barlbl left" style="left:calc(${pct(s.start)} - 6px)">${esc(s.text)}</span>`}</div></div>`).join('')
    + `<div class="axis">${ticks.map(t => `<span style="left:${(t / span * 100).toFixed(2)}%">${fmt(t)}</span>`).join('')}</div>`;
}

// ---------------------------------------------------------------- Teil 2: Live-Wand
function renderWall() {
  const all = Object.values(D.aufrufe).sort((a, b) => a.id.localeCompare(b.id));
  const running = all.filter(a => a.status === 'run');
  const show = running.length ? running : all.slice(-3);
  $('wallTitle').textContent = running.length ? `Live: ${running.length} ${running.length === 1 ? 'Agent arbeitet' : 'Agenten arbeiten gleichzeitig'}` : 'Live';
  $('wallHint').textContent = running.length ? 'Jedes Fenster ist ein eigener Modell-Aufruf' : (all.length ? 'Gerade läuft kein Modell, hier die letzten Aufrufe' : 'Noch kein Modell-Aufruf');
  const key = show.map(a => a.id + a.status).join() + selK;
  const wall = $('wall');
  if (wall.dataset.key !== key) {
    wall.dataset.key = key;
    wall.innerHTML = show.map(a => `<div class="card ${a.status === 'run' ? 'run' : 'done'} ${a.knoten === selK ? 'sel' : ''}" data-k="${a.knoten}" data-a="${a.id}">
      <header><b>${esc(G.knoten[a.knoten].titel)}${a.runde > 1 ? ` · R${a.runde}` : ''}</b><span>${esc(a.anbieter)} · ${esc(a.modell)}</span></header><pre></pre></div>`).join('');
  }
  wall.querySelectorAll('.card').forEach(c => {
    const pre = c.querySelector('pre'), t = (D.live[c.dataset.a] || '').slice(-2500);
    if (pre.textContent !== t) { pre.textContent = t; pre.scrollTop = pre.scrollHeight; }

}

  }
  if (!KI(node.art)) {
    const what = node.art === 'mensch' ? 'Hier bist du gefragt. Kein Modell, kein Prompt.' : `Dieser Schritt ist ein Skript. Kein Modell, kein Prompt. Er führt aus: <code>${esc(node.befehl)}</code>`;
    left.innerHTML = `<p class="note">${what}</p>` + (tab === 'aufruf' && node.befehl ? `<pre class="raw box">$ ${esc(node.befehl)}</pre>` : '');
    return;
  }
  if (!call) {
    const pt = G.prompts[node.prompt] || '';
    left.innerHTML = tab === 'prompt'
      ? `<p class="note">Noch nicht aufgerufen. So sieht die Prompt-Datei gerade aus:</p><div class="filehead"><code>prompts/${esc(node.prompt)}</code></div><pre class="raw box">${esc(pt)}</pre>`
      : tab === 'kontext'
        ? `<p class="note">Noch nicht aufgerufen. Geplanter Kontext laut <code>orchestrator/graph.py</code>:</p><ul>${(node.kontext || []).map(c => `<li><code>${esc(c.replace('?', ''))}</code>${c.endsWith('?') ? ' (falls vorhanden)' : ''}</li>`).join('')}</ul>`
        : '<p class="empty">Noch kein Aufruf.</p>';
    return;
  }
  left.innerHTML = '<p class="empty">Lade …</p>';
  const rec = await record(call.id);
  if (key !== panelKey || !rec) return;
  if (tab === 'prompt') {
    left.innerHTML = `<div class="filehead"><code>${esc(rec.prompt_datei)}</code><span class="hint">${kb(rec.prompt.length)} Zeichen</span></div><pre class="raw box">${esc(rec.prompt)}</pre>`;
  } else if (tab === 'kontext') {
    const parts = [{ name: rec.prompt_datei, quelle: rec.prompt_datei, text: rec.prompt, color: 'var(--c1)' }, ...rec.kontext.map((c, i) => ({ ...c, color: COLORS[i % COLORS.length] }))];
    const total = parts.reduce((n, p) => n + p.text.length, 0);
    left.innerHTML = `<div class="filehead"><span><b>${kb(total)} Zeichen</b> ≈ ${kb(Math.round(total / 4))} Tokens</span></div>
      <div class="compose">${parts.map(p => `<span style="flex:${p.text.length};background:${p.color}" title="${esc(p.name)}"></span>`).join('')}</div>
      <ul class="ctx">${parts.map(p => `<li><details><summary><span class="dot" style="background:${p.color}"></span><code>${esc(p.name)}</code><span class="sz" title="${esc(p.quelle)}">${kb(p.text.length)} Zeichen</span></summary><pre>${esc(p.text)}</pre></details></li>`).join('')}</ul>`;
  } else if (tab === 'aufruf') {
    const a = rec.anfrage, parts = [rec.prompt_datei, ...rec.kontext.map(c => c.name)];
    const fakten = [['Anbieter', rec.anbieter], ['Modell', rec.modell],
      ['Art', a.befehl ? (a.werkzeuge.length ? 'Agent mit Werkzeugen' : 'Claude Code ohne Werkzeuge') : 'HTTP-Aufruf']];
    if (rec.dauer != null) fakten.push(['Dauer', `${String(rec.dauer).replace('.', ',')} s`]);
    if (rec.kosten_usd != null) fakten.push(['Kosten', `${rec.kosten_usd.toFixed(3).replace('.', ',')} USD`]);
    fakten.push(['Tokens (geschätzt)', `≈ ${kb(tokIn(call))} rein · ${kb(tokOut(call))} raus`]);
    if (rec.fehler) fakten.push(['Fehler', rec.fehler]);
    const demo = rec.simuliert ? `<p class="note warn">Demo: Statt des Modells antwortet ein vorbereiteter Text. Alles danach läuft echt.</p>` : '';
    const body = a.befehl ? '' : `{\n  "model": "${a.body.model}",\n  "stream": true,\n  "messages": [{\n    "role": "user",\n    "content": "${parts.map(p => '‹' + p + '›').join(' + ')}"\n  }]\n}`;
    const tech = a.befehl
      ? `<pre class="raw box">$ ${esc(a.befehl.join(' '))} &lt; ‹${esc(parts.join(' + '))}›</pre>` +
        (a.werkzeuge.length ? `<p class="note" style="margin-top:14px">Erlaubte Werkzeuge, alles andere wird abgelehnt:</p><pre class="raw box">${esc(a.werkzeuge.join('\n'))}</pre>` : '')
      : `<pre class="raw box">POST ${esc(a.url)}\nAuthorization: Bearer $${esc(a.key)}\nContent-Type: application/json\n\n${esc(body)}</pre>`;
    left.innerHTML = demo + `<dl class="fakten">${fakten.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl><details class="tech"><summary>Technischen Aufruf zeigen</summary>${tech}</details>`;
  }
}
let outKey = '';
function renderOut(node, call) {
  const box = $('out');
  let html, lbl, raw = false, text;
  if (call) {
    text = D.live[call.id] || '';
    raw = !node.ausgabe[0].endsWith('.md');
    lbl = `→ ${node.ausgabe.map(f => f.replace('{runde}', call.runde)).join(', ')}`;
    if (!text) html = '<p class="empty">Wartet auf die ersten Zeichen …</p>';
  } else {
    const ev = D.events.filter(e => e.knoten === selK && e.datei).pop();
    text = ev ? D.dateien[ev.datei] : '';
    lbl = ev ? ev.datei : '';
    if (!text) html = node.art === 'mensch' && stateOf(selK) === 'run' && node.befehl
      ? `<p>Der Lauf wartet auf dich. Prüfe das Ergebnis über „Ergebnis spielen“ und übernimm es dann mit</p><pre class="raw box">$ ${esc(node.befehl)}</pre>`
      : `<p class="empty">${stateOf(selK) === 'run' ? 'Läuft …' : 'Noch keine Ausgabe.'}</p>`;
  }
  $('outlbl').textContent = lbl;
  const key = (call ? call.id : selK) + '|' + (text || '').length + '|' + raw;
  if (key === outKey) return;
  const fresh = !outKey.startsWith((call ? call.id : selK) + '|');
  outKey = key;
  const stick = fresh || box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.innerHTML = html || (raw ? `<pre class="raw">${esc(text)}</pre>` : `<div class="md">${md(text)}</div>`);
  if (stick && (call ? call.status === 'run' : false)) box.scrollTop = box.scrollHeight;
  else if (fresh) box.scrollTop = 0;
}

// ---------------------------------------------------------------- Protokoll
let logKey = '';
function renderLog() {
  const ev = D.events.filter(e => teil === 2 || e.status !== 'kante');
  const key = teil + '|' + ev.length;
  if (key === logKey) return; logKey = key;
  $('log').innerHTML = ev.map(e => {
    const n = G.knoten[e.knoten];
    let who, cls = e.status === 'fail' ? 'fail' : e.warnung ? 'warn' : e.status;
    if (teil === 1) who = !n ? 'Harness' : e.status === 'harness' || n.art === 'skript' ? 'Harness' : n.art === 'mensch' ? 'Du' : 'Agent';
    else who = n ? n.titel : 'Orchestrator';
    const detail = teil === 1 ? (n ? phaseTitle(n.phase) : '') : (e.befehl || (e.anbieter ? `${e.anbieter} · ${e.modell}` : ''));
    return `<li><time>${esc(e.zeit)}</time><b>${esc(who)}</b><span class="${cls}">${esc(e.text)}</span><span class="detail">${esc(detail)}</span></li>`;
  }).join('');
  $('log').scrollTop = $('log').scrollHeight;
}

// ---------------------------------------------------------------- Takt
function render() {
  if (teil === 1) { selK = agent1; selA = null; }   // Teil 1 zeigt immer denselben Agenten
  else if (follow || !selK) autoSelect();
  renderHead();
  if (teil === 2) { renderKonzept(); renderGraph(); renderTimeline(); renderWall(); }
  renderPanel();
  renderLog();
}
async function tick() {
  try {
    if (!G) {
      G = await (await fetch('/api/graph')).json();
      $('agent').innerHTML = Object.keys(G.knoten).filter(k => KI(G.knoten[k].art)).map(k => `<option value="${k}">${esc(G.knoten[k].titel)}</option>`).join('');
      $('agent').value = agent1;
    }
    const runs = await (await fetch('/api/runs')).json(), sel = $('run');
    if (sel.options.length !== runs.length) {
      sel.innerHTML = runs.map(r => `<option>${esc(r)}</option>`).join('');
      if (!current || follow) switchRun(runs[0]);
      sel.value = current;
    }
    if (!current) { $('zustand').innerHTML = '<span class="empty">Noch kein Lauf. Starte in VS Code den Task „2 Demo ohne API-Keys“.</span>'; return; }
    D = await (await fetch('/api/run/' + current)).json();
    D.start = D.start || {};
    render();
  } catch (e) {
    console.error(e);
    $('zustand').innerHTML = '<span class="empty">Keine Verbindung. Läuft der Task „1 Dashboard starten“?</span>';
    $('zustand')._html = null;
  }
}
function switchRun(id) { current = id; selK = null; selA = null; panelKey = outKey = logKey = ''; $('wall').dataset.key = ''; }
function setTeil(n) { teil = n; ansicht = 'graph'; erklaert = null; history.replaceState(null, '', n === 2 ? '#teil2' : '#teil1'); panelKey = logKey = ''; if (D) render(); }
function pick(k, a) { follow = false; selK = k; selA = a || null; if (teil === 2) ansicht = 'knoten'; if (D) render(); }
function toggleErkl(id) { erklaert = erklaert === id ? null : id; if (D) render(); }
function setTab(t) { tab = t; erklaert = null; if (D) render(); }

$('t1').onclick = () => setTeil(1);
$('t2').onclick = () => setTeil(2);
$('follow').onclick = () => { follow = !follow; if (follow) selA = null; if (D) render(); };
$('run').onchange = e => { switchRun(e.target.value); follow = false; tick(); };
$('tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) setTab(b.dataset.t); };
$('erkl').onclick = $('konzept').onclick = e => { const b = e.target.closest('[data-erkl]'); if (b) toggleErkl(b.dataset.erkl); };
$('ansicht').onclick = e => { if (e.target.dataset.a) { ansicht = e.target.dataset.a; if (D) render(); } };
$('agent').onchange = e => { agent1 = e.target.value; panelKey = outKey = ''; if (D) render(); };
$('mehr').onclick = () => { const zu = $('laufbox').hidden; $('laufbox').hidden = !zu; $('mehr').setAttribute('aria-expanded', zu); };
$('rounds').onclick = e => { if (e.target.dataset.a) pick(selK, e.target.dataset.a); };
$('graph').onclick = e => { const g = e.target.closest('.node'); if (g) pick(g.dataset.k); };
$('wall').onclick = e => { const c = e.target.closest('.card'); if (c) pick(c.dataset.k, c.dataset.a); };
$('tl').onclick = e => { const r = e.target.closest('.tlrow'); if (r) pick(r.dataset.k, r.dataset.a || null); };
tick(); setInterval(tick, 700);
</script>
</body>
