<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agentenlauf</title>
<style>
:root { /* EXCO: Grün #3CB64C, Grau #797272, Hellgrau #E1DFDD */
  --bg:#F4F3F2; --panel:#FFFFFF; --ink:#2B2727; --muted:#635C5C; --line:#E1DFDD; --heavy:#797272; --accent:#23843A; --soft:#E3F4E5;
  --ok:#1F6B2B; --oksoft:#DDEEDF; --bad:#B3261E; --badsoft:#F9E1DE; --warn:#8A5300; --warnsoft:#F6ECD5; --code:#F4F3F2;
  --c1:#797272; --c2:#3CB64C; --c3:#1F6B2B; --c4:#B5AFAF; --c5:#C98A1B;
  --brand:#3CB64C; --kopf:#797272; --kopf-text:#FFFFFF; --on-accent:#FFFFFF; color-scheme: light; }   /* immer hell, auch bei dunklem System-Theme */
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Segoe UI", "Segoe UI Web (West European)", system-ui, sans-serif; }
/* Kopfband wie im EXCO-SharePoint: graue Leiste mit grüner Linie */
body::before { content: "TechTalk  ·  KI-Agenten"; display: block; height: 44px; padding: 0 24px; line-height: 44px; background: var(--kopf); color: var(--kopf-text); font-weight: 600; font-size: .95rem; letter-spacing: .02em; border-bottom: 4px solid var(--brand); }
button, select { font: inherit; color: inherit; }
code, pre, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
.wrap { max-width: 1560px; margin: auto; padding: 20px 16px 16px; display: grid; gap: 18px; }

/* Kopf */
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.links { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
h1 { margin: 0; font-size: 1.8rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.badge { font-size: .78rem; font-weight: 600; padding: 3px 8px; border-radius: 4px; }
.badge.live { background: var(--soft); color: var(--accent); }
.badge.demo { background: var(--warnsoft); color: var(--warn); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1.5px solid var(--heavy); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 6px 12px; cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--on-accent); }
select, a.btn, button.btn { background: var(--panel); border: 1.5px solid var(--heavy); border-radius: 4px; padding: 6px 10px; text-decoration: none; cursor: pointer; }
a.btn { color: var(--ink); }
.btn.stopp { color: var(--bad); border-color: var(--bad); font-weight: 600; }
a.btn.primary, button.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
/* Hover: Knöpfe sollen sich wie Knöpfe anfühlen */
select, a.btn, button.btn, .seg button { transition: background-color .15s, border-color .15s, color .15s, box-shadow .15s, transform .08s; }
select:hover, a.btn:hover, button.btn:hover { border-color: var(--accent); background: var(--soft); box-shadow: 0 2px 6px rgba(0,0,0,.12); }
a.btn.primary:hover, button.btn.primary:hover { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.btn.stopp:hover { background: var(--badsoft); border-color: var(--bad); }
.seg button:hover:not(.on) { background: var(--soft); color: var(--accent); }
a.btn:active, button.btn:active, .seg button:active { transform: translateY(1px); box-shadow: none; }
#mehr[aria-expanded="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
a.btn:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { a.btn, button.btn, .seg button { transition: none; } }
.startline { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: .9rem; color: var(--muted); }
.cmd { background: var(--ink); color: var(--panel); padding: 4px 10px; border-radius: 4px; font-size: .85rem; }
.cmd::before { content: "$ "; opacity: .6; }
.runstate { font-weight: 600; }
.runstate.run { color: var(--accent); } .runstate.ok { color: var(--ok); } .runstate.fail { color: var(--bad); } .runstate.wait { color: var(--warn); }

/* Teil 2: Graph */
.graphbox { background: var(--panel); border: 2px solid var(--heavy); border-radius: 4px; overflow-x: auto; }
#graph { display: block; min-width: 900px; width: 100%; height: auto; }
#graph .band { fill: var(--bg); } #graph .band.alt { fill: var(--panel); }
#graph .bandlabel { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
#graph .edge { fill: none; stroke: var(--line); stroke-width: 1.6; }
#graph .edge.on { stroke: var(--heavy); stroke-width: 2; }
#graph .edge.loop { stroke-dasharray: 5 4; }
#graph .edge.loop.on { stroke: var(--warn); stroke-width: 3.5; }
#graph .elabel { font-size: 12.5px; fill: var(--muted); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
#graph .elabel.on { fill: var(--ink); font-weight: 600; }
#graph .elabel.loop.on { fill: var(--warn); }
#graph .node { cursor: pointer; }
#graph .node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
#graph .node.s-run rect { fill: var(--soft); stroke: var(--accent); stroke-width: 2.5; animation: pulse 1.2s ease-in-out infinite; }
#graph .node.s-ok rect { fill: var(--oksoft); stroke: var(--ok); }
#graph .node.s-fail rect { fill: var(--badsoft); stroke: var(--bad); }
#graph .node.sel rect { stroke: var(--ink); stroke-width: 3; }
#graph .node .t { font-size: 15.5px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
#graph .node rect.rbadge { fill: var(--warn); stroke: none; animation: none; } #graph .rbadge-t { fill: var(--panel); font-size: 10px; font-weight: 700; }
@keyframes pulse { 50% { stroke-opacity: .35; } }
@media (prefers-reduced-motion: reduce) { #graph .node.s-run rect { animation: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--heavy); vertical-align: middle; margin-right: 6px; }
.legend i.loop { border-top: 2px dashed var(--warn); }

/* Teil 2: Live-Wand */
.wallhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.wallhead h2, .panelhead h2, .loghead h2 { margin: 0; font-size: 1rem; }
.hint { font-size: .82rem; color: var(--muted); }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1.5px solid var(--line); border-radius: 4px; min-width: 0; cursor: pointer; display: flex; flex-direction: column; }
.card.run { border-color: var(--accent); }
.card.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.card header { padding: 6px 10px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; }
.card header b { white-space: nowrap; } .card header span { color: var(--muted); font-size: .75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card pre { margin: 0; padding: 8px 10px; height: 170px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .74rem; line-height: 1.4; }
.card.done pre { opacity: .7; }

/* Detail-Panel */
.panel { background: var(--panel); border: 2px solid var(--heavy); border-radius: 4px; min-width: 0; }
.panelhead { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1.5px solid var(--heavy); }
.panelhead .who { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.panelhead .sub { font-size: .82rem; color: var(--muted); }
.chip { font-size: .75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); }
.chip.run { color: var(--accent); border-color: var(--accent); } .chip.ok { color: var(--ok); border-color: var(--ok); } .chip.fail { color: var(--bad); border-color: var(--bad); }
.rounds { display: flex; gap: 4px; flex-wrap: wrap; }
.rounds button { font-size: .75rem; padding: 2px 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 4px; cursor: pointer; }
.rounds button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.panelbody { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.panelbody > div { min-width: 0; }
.panelbody > div:first-child { border-right: 1.5px solid var(--heavy); }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; color: var(--muted); font-size: .88rem; }
.tabs button.on { background: var(--ink); color: var(--panel); }
.tabs .lbl { margin-left: auto; align-self: center; font-size: .75rem; color: var(--muted); padding-right: 6px; }
.pane { padding: 14px; height: 470px; overflow: auto; }
.pane.out { font-size: .92rem; }
.pane pre.raw { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .82rem; line-height: 1.5; }
.filehead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 8px; font-size: .85rem; }
.filehead code { font-weight: 600; }
.box { background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; }
.note { font-size: .85rem; color: var(--muted); margin: 0 0 10px; }
.note.warn { color: var(--warn); }
.compose { display: flex; height: 22px; border-radius: 4px; overflow: hidden; margin: 6px 0 4px; border: 1px solid var(--line); }
.compose span { min-width: 3px; }
.ctx { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.ctx details { border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.ctx summary { cursor: pointer; padding: 6px 10px; display: flex; gap: 8px; align-items: center; font-size: .86rem; }
.ctx summary .dot { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.ctx summary .sz { margin-left: auto; color: var(--muted); font-size: .76rem; white-space: nowrap; }
.ctx pre { margin: 0; padding: 8px 10px; max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .76rem; border-top: 1px solid var(--line); }
.hl { list-style: none; margin: 0; padding: 0; }
.hl li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .87rem; display: grid; grid-template-columns: 4.6em minmax(0,1fr); gap: 2px 8px; }
.hl time { color: var(--muted); font-size: .78rem; }
.hl code { grid-column: 2; font-size: .76rem; background: var(--code); padding: 2px 6px; border-radius: 3px; overflow-wrap: anywhere; justify-self: start; }
.hl .kante { color: var(--warn); font-weight: 600; }
.empty { color: var(--muted); }
@media (max-width: 860px) { .panelbody { grid-template-columns: minmax(0, 1fr); } .panelbody > div:first-child { border-right: 0; border-bottom: 1.5px solid var(--heavy); } .pane { height: 380px; } }

/* Markdown */
.md h1 { font-size: 1.3rem; margin: 0 0 10px; } .md h2 { font-size: 1.05rem; margin: 16px 0 6px; } .md h3 { font-size: .95rem; margin: 12px 0 4px; }
.md p, .md ul, .md ol, .md pre { margin: 0 0 10px; }
.md code { font-size: .86em; background: var(--soft); padding: 1px 4px; border-radius: 3px; }
.md pre { background: var(--code); padding: 10px; overflow-x: auto; font-size: .8rem; } .md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; width: 100%; font-size: .88rem; margin-bottom: 10px; }
.md th, .md td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }

/* Protokoll */
.loghead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.log { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; border-top: 1.5px solid var(--heavy); font-size: .88rem; background: var(--panel); }
.log li { display: grid; grid-template-columns: 5.2em 8.5em minmax(0,1fr) minmax(0,16em); gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--line); }
.log time { color: var(--muted); font-size: .8rem; }
.log b { font-weight: 600; } .log .fail { color: var(--bad); } .log .harness { color: var(--muted); } .log .kante { color: var(--warn); font-weight: 600; }
.log .detail { color: var(--muted); font-size: .74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 760px) { .log li { grid-template-columns: 4.6em minmax(0,1fr); } .log .detail, .log li > b { display: none; } }
/* Teil 2: Zeitleiste */
.tl { background: var(--panel); border: 1.5px solid var(--line); border-radius: 4px; padding: 8px 12px 10px; }
.tlrow { display: grid; grid-template-columns: 10.5em minmax(0, 1fr); gap: 10px; align-items: center; min-height: 26px; cursor: pointer; }
.tlrow:hover .tlname { color: var(--accent); }
.tlrow.sel .tlname { font-weight: 700; }
.tlname { font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tlname small { color: var(--muted); }
.track { position: relative; height: 20px; }
.bar { position: absolute; top: 2px; height: 16px; border-radius: 3px; min-width: 3px; background: var(--ok); color: var(--panel); font-size: .68rem; line-height: 16px; padding: 0 5px; white-space: nowrap; overflow: hidden; }
.bar.run { background: var(--accent); background-image: repeating-linear-gradient(45deg, transparent 0 6px, rgba(255,255,255,.22) 6px 12px); }
.bar.fail { background: var(--bad); } .bar.skript { background: var(--muted); } .bar.skript.fail { background: var(--bad); }
.axis { position: relative; height: 18px; margin-left: calc(10.5em + 10px); border-top: 1px solid var(--line); margin-top: 4px; }
.axis span { position: absolute; top: 2px; font-size: .68rem; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
.barlbl { position: absolute; top: 2px; font-size: .7rem; line-height: 16px; color: var(--muted); white-space: nowrap; }
.barlbl.left { transform: translateX(-100%); }
.log .warn, .hl .warn { color: var(--warn); font-weight: 600; }
.log .warn::before, .hl .warn::before { content: "\26A0  "; }
#graph .warnmark { fill: var(--warn); } #graph .warnmark-t { fill: var(--panel); font-size: 11px; font-weight: 800; }
/* Vorführung: Bausteine, Erklärungen, Aufklappbares */
.zustand { font-size: .9rem; }
.laufbox { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--panel); border: 1.5px solid var(--line); border-radius: 4px; padding: 10px 12px; }
/* Stationen von links nach rechts: gleiche Zustandsfarben wie im Graph */
.flow { display: flex; gap: 8px; align-items: stretch; padding: 12px; }
.flow .op { align-self: center; font-size: 1.6rem; color: var(--line); flex: none; }
.flow .op.on { color: var(--heavy); }
.station { flex: 1 1 0; min-width: 0; position: relative; }
.haupt { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: 18px 16px 14px; cursor: pointer; }
.haupt:hover { border-color: var(--heavy); }
.haupt b { font-size: 1.3rem; line-height: 1.2; padding-right: 30px; }
.haupt .kurz { color: var(--muted); font-size: .95rem; line-height: 1.35; }
.haupt .stand { margin-top: auto; padding-top: 10px; font-size: .84rem; color: var(--muted); overflow-wrap: anywhere; }
.station.s-ok .haupt { background: var(--oksoft); border-color: var(--ok); }
.station.s-fail .haupt { background: var(--badsoft); border-color: var(--bad); }
.station.s-run .haupt { background: var(--soft); border-color: var(--accent); animation: leuchten 1.2s ease-in-out infinite; }
.station.s-run .stand { color: var(--accent); font-weight: 600; }
.station.on .haupt { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.station .info { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; font-size: .95rem; }
@keyframes leuchten { 0%, 100% { box-shadow: 0 0 3px 0 var(--accent); } 50% { box-shadow: 0 0 20px 3px var(--accent); } }
@media (prefers-reduced-motion: reduce) { .station.s-run .haupt { animation: none; box-shadow: 0 0 0 2px var(--accent); } }
body.teil2 .haupt { padding: 10px 12px; } body.teil2 .haupt b { font-size: 1.05rem; padding-right: 0; } body.teil2 .haupt .stand { padding-top: 2px; }
/* Aufklappbereich: der Zeiger steht unter der gewaehlten Station oder dem gewaehlten Knoten */
.drawer { position: relative; background: var(--panel); border: 2px solid var(--heavy); border-radius: 4px; margin-top: 10px; }
body.teil2 .drawer { margin: 0 12px 12px; }
#panel { position: relative; }
.zeiger::before { content: ""; position: absolute; top: -9px; left: var(--zeiger, 50%); width: 14px; height: 14px; margin-left: -7px; transform: rotate(45deg); background: var(--panel); border-left: 2px solid var(--heavy); border-top: 2px solid var(--heavy); }
body:not(.teil2) #panel { background: none; border: 0; }
body:not(.teil2) .panelhead { border: 0; padding: 0 2px 10px; }
body:not(.teil2) .flow { padding: 0; }
body:not(.teil2) #zu { display: none; }
.erkl { padding: 12px 16px; }
.erkl .kern { display: flex; gap: 16px; justify-content: space-between; align-items: center; font-size: 1.25rem; }
.info { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--heavy); background: none; color: inherit; font: italic 700 1.15rem Georgia, serif; cursor: pointer; flex: none; }
.info.offen { background: var(--ink); color: var(--panel); font-style: normal; }
.erkl .wert { margin: 10px 0 0; font-weight: 600; }
.erkl ul { margin: 8px 0 0; padding-left: 20px; }
.erkl li { margin: 4px 0; }
.pfad { margin: 0; padding: 8px 16px 0; font-size: .82rem; color: var(--muted); }
#panel .pane { height: min(56vh, 560px); border-top: 1px solid var(--line); }
body.teil2 #panel .pane { height: calc(100vh - 610px); min-height: 240px; }   /* Graph und Details passen zusammen auf den Schirm */
.haken { list-style: none; margin: 0 0 14px; padding: 0; font-size: 1.1rem; }
.haken li { padding: 6px 0; }
.haken li::before { content: "\2713"; color: var(--ok); font-weight: 700; margin-right: 10px; }
.haken li.warn { color: var(--warn); } .haken li.warn::before { content: "\26A0"; color: var(--warn); }
.haken li.kante { color: var(--warn); } .haken li.kante::before { content: "\2192"; color: var(--warn); }
.v2kopf { display: flex; gap: 12px; align-items: flex-start; }
.v2kopf .konzept { flex: 1; min-width: 0; }
#ansicht { flex: none; padding-top: 10px; }
#protokoll { flex-basis: 100%; }
.pane pre.raw { font-size: .92rem; }
.fakten { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 6px 18px; margin: 0 0 14px; }
.fakten dt { color: var(--muted); } .fakten dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
details.tech > summary, details.mehr > summary { cursor: pointer; color: var(--accent); }
details.tech[open] > summary { margin-bottom: 10px; }
details.mehr { background: var(--panel); border: 1.5px solid var(--line); border-radius: 4px; padding: 10px 14px; }
details.mehr[open] > summary { margin-bottom: 10px; }
.konzept { border-bottom: 0; padding-left: 0; }
.unter { margin-top: 10px; }
@media (max-width: 860px) { .flow { flex-direction: column; } .flow .op { display: none; } }
/* Teil 1: Ablauf in Stufen (Variante C) */
.stufen { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; background: var(--panel); border: 1.5px solid var(--line); border-radius: 4px; padding: 10px; }
.stufen .stufe { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 4px; border: 1.5px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 600; font-size: 1.05rem; }
.stufen .stufe:hover { border-color: var(--heavy); }
.stufen .auf { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px 6px 14px; border-radius: 4px; background: var(--soft); border: 1.5px solid var(--accent); }
.stufen .auf > b { color: var(--accent); margin-right: 6px; font-size: 1.05rem; }
.stufen .schritt { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 4px; border: 1.5px solid var(--line); background: var(--panel); cursor: pointer; font-size: .95rem; }
.stufen .schritt:hover { border-color: var(--heavy); }
.stufen .schritt.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.stufen .schritt.nn { opacity: .55; }
.stufen .pfeil { align-self: center; font-size: 1.4rem; color: var(--muted); opacity: .5; }
.st { display: inline-flex; width: 14px; justify-content: center; flex: none; font-weight: 700; }
.st.ok::before { content: "\2713"; color: var(--ok); }
.schritt.on .st.ok::before { color: inherit; }
.st.fail::before { content: "\2717"; color: var(--bad); }
.schritt.on .st.fail::before { color: inherit; }
.st.run::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--brand); animation: punkt 1.2s ease-in-out infinite; }
.schritt.on .st.run::before { background: var(--on-accent); }
.st.wait::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--c4); box-sizing: border-box; }
.versuch { font-size: .75rem; padding: 0 6px; border-radius: 3px; background: var(--warnsoft); color: var(--warn); }
.schritt.on .versuch { background: var(--panel); }
.stufen .nninfo { font-size: .75rem; }
@keyframes punkt { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .st.run::before { animation: none; } }
/* Start-Gruppe oben und Entscheidungs-Leiste für den angezeigten Lauf */
.seg .lbl { padding: 6px 10px; font-size: .85rem; color: var(--muted); border-right: 1px solid var(--line); background: var(--bg); align-self: center; }
.startgruppe button + button { border-left: 1px solid var(--line); }
.startgruppe button.gesperrt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--c4); cursor: help; }
.entscheidung { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 4px; background: var(--warnsoft); border: 1.5px solid var(--warn); }
.entscheidung.demo { background: var(--soft); border-color: var(--accent); }
.entscheidung.abgebrochen { background: var(--badsoft); border-color: var(--bad); }

[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="links">
      <h1>Sudoku-Agenten</h1>
      <div class="seg" role="group" aria-label="Ansicht">
        <button id="t1">Teil 1 · Ein Agent</button>
        <button id="t2">Teil 2 · Loop und Graph</button>
      </div>
    </div>
    <div class="controls">
      <span class="zustand" id="zustand"></span>
      <span class="zustand runstate fail" id="startfehler" hidden></span>
      <a class="btn" id="play" hidden target="_blank" rel="noopener">Ergebnis spielen</a>
      <div class="seg startgruppe" id="startgruppe" role="group" aria-label="Neuen Lauf starten" hidden>
        <span class="lbl">Neuer Lauf</span><button id="startDemo">▶ Demo</button><button id="startLive">▶ Echter Lauf</button>
      </div>
      <button class="btn stopp" id="stopp" hidden>■ Abbrechen</button>
      <button class="btn" id="mehr" aria-expanded="false">Lauf ▾</button>
    </div>
  </div>
  <div class="laufbox" id="laufbox" hidden>
    <span class="badge" id="modus" hidden></span>
    <select id="run" aria-label="Lauf wählen"></select>
    <label>Demo spielt ab <select id="aufz" aria-label="Aufzeichnung für die Demo"></select></label>
    <label>Tempo <select id="tempo"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select></label>
    <div class="startline" id="startline"></div>
    <details class="mehr" id="protokoll">
      <summary>Protokoll: jeder Schritt dieses Laufs</summary>
      <ol class="log" id="log"></ol>
    </details>
  </div>

  <div class="entscheidung" id="entscheidung" hidden>
    <span id="entscheidungText"></span>
    <span class="aktionen"><a class="btn" id="play2" target="_blank" rel="noopener">Ergebnis spielen</a><button class="btn primary" id="freigabe">✓ Freigeben</button><button class="btn stopp" id="verwerfen">✕ Verwerfen</button></span>
  </div>

  <nav class="stufen" id="stufen" aria-label="Ablauf in Stufen" hidden></nav>

  <section id="v2" hidden>
    <div class="v2kopf">
      <div class="konzept erkl" id="konzept"></div>
      <div class="controls" id="ansicht">
        <button class="btn" data-a="graph">← Graph</button><button class="btn" data-a="zeit">Zeitleiste</button><button class="btn" data-a="live">Live</button>
      </div>
    </div>
    <div class="graphbox unter" id="graphbox">
      <svg id="graph" role="img" aria-label="Ablauf als Graph"></svg>
    </div>
    <div class="unter" id="tlbox" hidden>
      <div class="wallhead"><h2>Zeitleiste</h2><span class="hint">Übereinander = gleichzeitig</span></div>
      <div class="tl" id="tl"></div>
    </div>
    <div class="unter" id="wallbox" hidden>
      <div class="wallhead"><h2 id="wallTitle">Live</h2><span class="hint" id="wallHint"></span></div>
      <div class="wall" id="wall"></div>
    </div>
  </section>

  <section class="panel" id="panel">
    <div class="panelhead"><div class="who"><span id="who"></span><span class="sub" id="was"></span></div><div class="rounds" id="rounds"></div><button class="btn" id="zu" aria-label="Details schließen">×</button></div>
    <div class="flow" id="tabs"></div>
    <div class="drawer zeiger" id="drawer" hidden>
      <div class="erkl" id="erkl" hidden></div>
      <p class="pfad" id="outlbl" hidden></p>
      <div class="pane" id="left"></div>
      <div class="pane out" id="out" hidden></div>
    </div>
  </section>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inline = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
function md(src) {
  const L = (src || '').trim().split(/\r?\n/), o = [];
  for (let i = 0; i < L.length;) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith('```')) { const c = []; for (i++; i < L.length && !L[i].startsWith('```'); i++) c.push(L[i]); i++; o.push(`<pre><code>${esc(c.join('\n'))}</code></pre>`); }
    else if (/^#{1,6} /.test(l)) { const n = Math.min(l.indexOf(' '), 3); o.push(`<h${n}>${inline(l.replace(/^#+ /,''))}</h${n}>`); i++; }
    else if (l.startsWith('|')) { const r = []; for (; i < L.length && L[i].startsWith('|'); i++) r.push(L[i].replace(/^\||\|\s*$/g,'').split('|').map(c => c.trim())); o.push('<table><thead><tr>' + r[0].map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' + r.slice(2).map(x => '<tr>' + x.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>'); }
    else if (/^(\s*[-*] |\d+\. )/.test(l)) { const t = /^\d/.test(l) ? 'ol' : 'ul', it = []; for (; i < L.length && /^(\s*[-*] |\d+\. )/.test(L[i]); i++) it.push(`<li>${inline(L[i].replace(/^(\s*[-*] |\d+\. )/,''))}</li>`); o.push(`<${t}>${it.join('')}</${t}>`); }
    else { const p = []; for (; i < L.length && L[i].trim() && !/^(#|\||\s*[-*] |\d+\. |```)/.test(L[i]); i++) p.push(inline(L[i])); if (!p.length) { p.push(inline(L[i])); i++; } o.push(`<p>${p.join('<br>')}</p>`); }
  }
  return o.join('');
}
const LABEL = { wait: 'wartet', run: 'läuft', ok: 'fertig', fail: 'Fehler' };
const ART = { modell: 'Sprachmodell', agent: 'Agent mit Werkzeugen', skript: 'Skript, kein Modell', mensch: 'Du' };
const KI = a => a === 'modell' || a === 'agent';
const SKRIPTE = ['gate', 'abnahme'];
const COLORS = ['var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)'];
const dateien = n => `${n} ${n === 1 ? 'Datei' : 'Dateien'}`;
const kb = n => n >= 1000 ? (n / 1000).toFixed(1).replace('.', ',') + ' k' : String(n);

let G = null, D = null, current = null, follow = true;
let teil = location.hash === '#teil2' ? 2 : 1, tab = null;   // tab null: nichts aufgeklappt
let selK = null, selA = null;   // gewählter Knoten und (optional) fester Aufruf
const records = {};              // volle Aufruf-Daten (Prompt, Kontext), unveränderlich
let ansicht = 'graph', detail = false, erklaert = null, agent1 = 'engine';   // detail: Knoten in Teil 2 aufgeklappt

// Nur neu zeichnen, wenn sich etwas geändert hat: Sonst gehen Klicks zwischen zwei Takten verloren.
function setHtml(el, html) { if (el._html !== html) { el._html = html; el.innerHTML = html; } }

const BAUSTEINE = [
  { t: 'prompt', name: 'Prompt' },
  { t: 'kontext', name: 'Kontext' },
  { t: 'aufruf', name: 'Modell' },
  { t: 'ausgabe', name: 'Antwort' },
  { t: 'harness', name: 'Harness' },
];
const OPS = ['+', '→', '→', '→'];
const ERKL = {
  prompt: { titel: 'Prompt Engineering', kern: 'Eine Datei legt Rolle, Regeln und Ausgabeformat fest.', lang: [
    'Der Prompt gehört zum Projekt: Er liegt unter <code>prompts/</code> und wird wie Code versioniert.',
    'Er nennt die Aufgabe, die Grenzen und das genaue Ausgabeformat, denn die Antwort wird maschinell weiterverarbeitet.',
    'Beispiel: Die Oberfläche muss einen festen Bedienvertrag einhalten, sonst kann das Prüfskript das Spiel nicht spielen.' ] },
  kontext: { titel: 'Kontext Engineering', kern: 'Das Modell weiß nur, was in dieser einen Nachricht steht.', lang: [
    'Jeder Agent bekommt gezielt die Dateien, die er braucht. Die Auswahl steht in <code>orchestrator/graph.py</code>.',
    'Die Engine sieht nur die Spezifikation, nicht die Recherche. Das hält sie beim Vertrag.',
    'Zu wenig Kontext führt zum Raten, zu viel kostet Tokens und lenkt ab.' ] },
  aufruf: { titel: 'Modell', kern: 'Austauschbar: <code>config.json</code> legt die Rollen fest.', lang: [
    'Einfache Rollen sind ein HTTP-Aufruf: eine Nachricht rein, eine Antwort raus.',
    'Agenten mit Werkzeugen arbeiten selbst im Ordner. Sie dürfen nur, was ausdrücklich freigegeben ist.',
    'Fällt ein Anbieter aus, weicht die Harness auf einen anderen aus und meldet das.' ] },
  ausgabe: { titel: 'Antwort', kern: 'Zunächst nur Text. Erst der Code drumherum macht daraus Dateien.', lang: [
    'Die Antwort wird live gestreamt, man sieht das Modell arbeiten.',
    'Ob sie etwas taugt, entscheidet nicht das Modell, sondern der nächste Baustein.' ] },
  harness: { titel: 'Harness Engineering', kern: 'Normaler Code prüft und steuert, was das Modell liefert.', lang: [
    'Sie übernimmt Codeblöcke in Dateien, prüft die Syntax und committet in einen eigenen Git-Worktree.',
    'Über „bestanden“ entscheiden Tests und ein Browser-Skript, das das Spiel wirklich spielt. Kein Modell benotet sich selbst.',
    'Ist eine Antwort unbrauchbar, fragt sie genau einmal mit dem Fehler nach. Scheitert es weiter, scheitert der Lauf sichtbar.' ] },
  graph: { kern: '<b>Graph:</b> Viele Agenten mit klarer Reihenfolge. <b>Loop:</b> Ein Prüfer schickt Arbeit zurück, bis sie besteht.', lang: [
    'Knoten sind Sprachmodelle, Agenten mit Werkzeugen, Skripte oder du. Kanten legen fest, was danach dran ist.',
    'Recherche und Umsetzung laufen parallel, jeder Agent in seinem eigenen Arbeitsstand.',
    'Bedingte Kanten folgen einem Urteil oder einem Testergebnis. Das entscheidet normaler Code.',
    'Jede Schleife hat eine harte Obergrenze, danach bricht der Lauf ab. Am Ende gibt ein Mensch frei.' ] },
};
function erklHtml(id, wert) {
  const e = ERKL[id], offen = erklaert === id;
  return `<div class="kern"><span>${e.kern}</span><button class="info ${offen ? 'offen' : ''}" data-erkl="${id}" title="${offen ? 'Schließen' : 'Genauer erklären'}" aria-label="${offen ? 'Schließen' : 'Genauer erklären'}" aria-expanded="${offen}">${offen ? '×' : 'i'}</button></div>` +
    (offen ? `${wert ? `<p class="wert">${wert}</p>` : ''}<ul>${e.lang.map(x => `<li>${x}</li>`).join('')}</ul>` : '');
}

// ---------------------------------------------------------------- Ableitungen aus den Events
const known = e => G.knoten[e.knoten];
// Bei einem abgebrochenen Lauf arbeitet niemand mehr: Was noch auf „läuft“ stand, gilt als Fehler.
function stateOf(k) { let s = 'wait'; for (const e of D.events) if (e.knoten === k && LABEL[e.status]) s = e.status; return s === 'run' && D.abgebrochen ? 'fail' : s; }
function callsOf(k) { return Object.values(D.aufrufe).filter(a => a.knoten === k).sort((a, b) => a.id.localeCompare(b.id)); }
function phaseOf(k) { return G.knoten[k].phase; }
function phaseNodes(p) { return Object.keys(G.knoten).filter(k => phaseOf(k) === p); }
function phaseTitle(p) { return (G.phasen.find(x => x.id === p) || {}).titel || p; }
function rounds(k) { return SKRIPTE.includes(k) ? D.events.filter(e => e.knoten === k && e.status === 'run').length : callsOf(k).length; }
function kantenCount(a, b) { return D.events.filter(e => e.status === 'kante' && e.von === a && e.nach === b).length; }
function runState() {
  const last = D.events[D.events.length - 1];
  if (!last) return ['run', 'startet'];
  if (last.knoten === 'orchestrator') return ['fail', last.text];
  // Eine Demo endet dort, wo im echten Lauf der Mensch entscheidet. Zu entscheiden gibt es bei ihr nichts.
  if (last.knoten === 'freigabe' && last.status === 'run') return D.start.quelle ? ['ok', 'Demo zu Ende'] : ['wait', 'wartet auf deine Freigabe'];
  if (last.knoten === 'freigabe' && last.status === 'ok') return ['ok', 'freigegeben: arbeitsbereich/projekt, Branch main'];
  if (last.knoten === 'freigabe' && last.status === 'fail') return ['fail', 'verworfen, Entwurf gelöscht'];
  return ['run', 'läuft'];
}
function autoSelect() {
  const ev = D.events.filter(e => known(e) && LABEL[e.status]);
  if (!ev.length) return;
  if (selK && stateOf(selK) === 'run') return;            // aktueller Agent arbeitet noch: bleiben
  // Arbeitet niemand (mehr), zeigen wir den letzten Agenten. Auf „Freigabe“ gäbe es nichts zu erklären.
  const running = ev.filter(e => e.status === 'run' && stateOf(e.knoten) === 'run' && G.knoten[e.knoten].art !== 'mensch');
  const agenten = ev.filter(e => KI(G.knoten[e.knoten].art));
  selK = (running.length ? running[running.length - 1] : agenten.length ? agenten[agenten.length - 1] : ev[ev.length - 1]).knoten;
  selA = null;
}
function modelLabel(k) {
  const a = callsOf(k).pop(); if (a) return `${a.anbieter} · ${a.modell}`;
  const r = (D.start.rollen || {})[k]; return r ? `${r.anbieter} · ${r.modell}` : '';
}
// Tokens grob geschätzt: etwa 4 Zeichen pro Token
const tokIn = a => Math.round(((a.prompt_zeichen || 0) + (a.kontext || []).reduce((n, c) => n + c.zeichen, 0)) / 4);
const tokOut = a => Math.round((a.antwort_zeichen || (D.live[a.id] || '').length) / 4);
const warned = k => D.events.some(e => e.knoten === k && e.warnung);
function tsec(e) {
  if (e.t) return e.t;
  const d = new Date(D.start.zeit || Date.now()), [h, m, s] = e.zeit.split(':').map(Number);
  d.setHours(h, m, s, 0); return d.getTime() / 1000;
}

// ---------------------------------------------------------------- Teil 1: Ablauf in Stufen
// Nur Anzeige: Die Agenten werden in einfache Stufen gruppiert. Knoten, die hier fehlen, landen in „Weitere“.
const STUFEN = [
  { name: 'Verstehen', ids: ['auftrag', 'recherche_a', 'recherche_b', 'pruefung'] },
  { name: 'Planen', ids: ['spezifikation', 'design'] },
  { name: 'Bauen', ids: ['engine', 'ui', 'tests'] },
  { name: 'Prüfen', ids: ['gate', 'testcheck', 'korrektur'] },
  { name: 'Fertigstellen', ids: ['integration', 'abnahme', 'freigabe'] },
];
function stufenListe() {
  const alle = Object.keys(G.knoten), drin = new Set(STUFEN.flatMap(s => s.ids));
  const liste = STUFEN.map(s => ({ name: s.name, ids: s.ids.filter(k => G.knoten[k]) })).filter(s => s.ids.length);
  const rest = alle.filter(k => !drin.has(k));
  if (rest.length) liste.push({ name: 'Weitere', ids: rest });
  return liste;
}
function stufeStatus(s, i, liste) {
  const st = s.ids.map(stateOf);
  if (st.includes('run')) return 'run';
  if (st.includes('fail')) return 'fail';
  const spaeter = liste.slice(i + 1).some(x => x.ids.some(k => stateOf(k) !== 'wait'));
  if (st.every(x => x === 'ok') || (st.includes('ok') && spaeter)) return 'ok';
  return 'wait';
}
function renderStufen() {
  const nav = $('stufen');
  nav.hidden = teil !== 1;
  if (teil !== 1) return;
  const liste = stufenListe();
  setHtml(nav, liste.map((s, i) => {
    const status = stufeStatus(s, i, liste), offen = s.ids.includes(agent1);
    const pfeil = i < liste.length - 1 ? '<span class="pfeil" aria-hidden="true">›</span>' : '';
    if (!offen) return `<button class="stufe" data-stufe="${i}"><span class="st ${status}"></span>${esc(s.name)}</button>${pfeil}`;
    const schritte = s.ids.map(k => {
      const z = stateOf(k), n = rounds(k), nn = z === 'wait' && status === 'ok';
      return `<button class="schritt ${k === agent1 ? 'on' : ''} ${nn ? 'nn' : ''}" data-k="${k}" aria-pressed="${k === agent1}"><span class="st ${z}"></span>${esc(G.knoten[k].titel)}${n > 1 ? `<span class="versuch">${n}. Versuch</span>` : ''}${nn ? '<span class="nninfo">nicht nötig</span>' : ''}</button>`;
    }).join('');
    return `<div class="auf"><b>${esc(s.name)}</b>${schritte}</div>${pfeil}`;
  }).join(''));
}
function waehleStufe(i) {
  const s = stufenListe()[i]; if (!s) return;
  const laeuft = s.ids.find(k => stateOf(k) === 'run'), lief = [...s.ids].reverse().find(k => stateOf(k) !== 'wait');
  waehleAgent(laeuft || lief || s.ids[0]);
}
function waehleAgent(k) {
  agent1 = k; erklaert = null; panelKey = outKey = '';
  if (D) render();
}

// ---------------------------------------------------------------- Kopf
function renderHead() {
  const s = D.start || {};
  $('modus').hidden = !s.modus;
  $('modus').textContent = s.modus === 'live' ? 'Echte Modelle' : s.quelle ? `Demo: Aufzeichnung von Lauf ${s.quelle}${s.tempo > 1 ? `, ${s.tempo}× so schnell` : ''}` : 'Demo';
  $('modus').className = 'badge ' + (s.modus || '');
  $('play').hidden = !D.ergebnis; $('play').href = `/ergebnis/${current}/index.html`;
  const [st, txt] = runState();
  const calls = Object.values(D.aufrufe), tin = calls.reduce((n, a) => n + tokIn(a), 0), tout = calls.reduce((n, a) => n + tokOut(a), 0);
  const tok = calls.length ? ` <span title="geschätzt: 4 Zeichen ≈ 1 Token">${calls.length} ${s.quelle ? 'aufgezeichnete ' : ''}Modell-Aufrufe · ≈ ${kb(tin)} Tokens rein, ${kb(tout)} raus</span>` : '';
  $('startline').innerHTML = s.befehl
    ? `<span>Gestartet mit</span> <code class="cmd">${esc(s.befehl)}</code> <span class="runstate ${st}">${esc(txt)}</span>${tok}`
    : `<span class="empty">Dieser Lauf hat noch keine start.json, vermutlich ein altes Format. Setze mit „0 Alles zurücksetzen“ neu auf.</span>`;
  $('t1').classList.toggle('on', teil === 1); $('t2').classList.toggle('on', teil === 2);
  $('v2').hidden = teil !== 2;
  document.body.classList.toggle('teil2', teil === 2);
  setHtml($('zustand'), st !== 'wait' ? `<span class="runstate ${st}">${esc(txt)}</span>` : '');
  $('panel').hidden = teil === 2 && !detail;
  $('graphbox').hidden = ansicht !== 'graph';
  $('tlbox').hidden = ansicht !== 'zeit'; $('wallbox').hidden = ansicht !== 'live';
  const laeuft = Object.values(D.aufrufe).some(a => a.status === 'run');
  [...$('ansicht').children].forEach(b => { b.hidden = b.dataset.a === 'graph' ? ansicht === 'graph' : b.dataset.a === ansicht || (b.dataset.a === 'live' && !laeuft); });
}

// ---------------------------------------------------------------- Teil 2: Loop und Graph erklären
function renderKonzept() {
  const n = D.start.max_runden;
  const loops = [['Recherche ↔ Prüfung', kantenCount('pruefung', 'recherche_a')], ['Tests ↔ Korrektur', kantenCount('gate', 'testcheck')], ['Integration ↔ Abnahmetest', kantenCount('abnahme', 'integration')]];
  const genommen = loops.filter(l => l[1]).map(([t, c]) => `${t}: ${c}× zurück`);
  setHtml($('konzept'), erklHtml('graph', [...genommen, ...(n ? [`höchstens ${n} Runden`] : [])].join(' · ')));
}

// ---------------------------------------------------------------- Teil 2: Graph
const C = { colw: 146, nw: 114, nh: 62, rowh: 104, x0: 14, y0: 22 };
function P(k) { const [c, r] = G.knoten[k].pos; return { x: C.x0 + c * C.colw, y: C.y0 + r * C.rowh, c, r }; }
function edgeGeom(a, b) {
  const A = P(a), B = P(b); let p;
  if (B.c > A.c) { const x1 = A.x + C.nw, y1 = A.y + C.nh / 2, x2 = B.x, y2 = B.y + C.nh / 2, dx = (x2 - x1) / 2; p = [[x1, y1], [x1 + dx, y1], [x2 - dx, y2], [x2, y2]]; }
  else if (B.c === A.c) { const x = A.x + C.nw * .35, up = B.r < A.r, y1 = up ? A.y : A.y + C.nh, y2 = up ? B.y + C.nh : B.y; p = [[x, y1], [x, y1], [x, y2], [x, y2]]; }
  else if (B.r !== A.r) { const up = B.r < A.r, x1 = A.x + C.nw / 2, y1 = up ? A.y : A.y + C.nh, x2 = B.x + C.nw * .75, y2 = up ? B.y + C.nh : B.y, m = (y1 + y2) / 2; p = [[x1, y1], [x1, m], [x2, m], [x2, y2]]; }
  else { const x1 = A.x + C.nw / 2, x2 = B.x + C.nw / 2, y = A.y + C.nh, cy = y + 30 + 22 * (A.c - B.c); p = [[x1, y], [x1, cy], [x2, cy], [x2, y]]; }
  const mid = [0, 1].map(i => (p[0][i] + 3 * p[1][i] + 3 * p[2][i] + p[3][i]) / 8);
  return { d: `M${p[0]} C${p[1]} ${p[2]} ${p[3]}`, mid };
}
function renderGraph() {
  const cols = Math.max(...Object.values(G.knoten).map(k => k.pos[0])) + 1;
  const W = C.x0 * 2 + cols * C.colw - (C.colw - C.nw), H = C.y0 + 2 * C.rowh + C.nh + 70;
  const svg = $('graph'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

}

// ---------------------------------------------------------------- Teil 2: Zeitleiste
function spans() {
  const [st] = runState(), last = D.events.length ? tsec(D.events[D.events.length - 1]) : 0;
  const now = st === 'run' ? Math.max(Date.now() / 1000, last) : last;
  const out = Object.values(D.aufrufe).map(a => ({
    k: a.knoten, id: a.id, runde: a.runde, start: a.start, status: a.status, skript: false,
    end: a.dauer != null ? a.start + a.dauer : now,
    text: a.status === 'run' ? `läuft seit ${Math.round(now - a.start)} s` : `${String(a.dauer).replace('.', ',')} s · ≈ ${kb(tokIn(a))} → ${kb(tokOut(a))} Tokens`,
  }));
  for (const k of SKRIPTE) {
    let open = null, n = 0;
    for (const e of D.events.filter(e => e.knoten === k && LABEL[e.status])) {
      if (e.status === 'run') { open = { k, id: k + (++n), runde: n, start: tsec(e), status: 'run', skript: true, end: now, text: 'Tests laufen' }; out.push(open); }
      else if (open) { open.end = Math.max(tsec(e), open.start + .3); open.status = e.status; open.text = e.status === 'ok' ? 'bestanden' : 'nicht bestanden'; open = null; }
    }
  }
  return out.sort((a, b) => a.start - b.start);
}
function renderTimeline() {
  const sp = spans(), tl = $('tl');
  if (!sp.length) { tl.innerHTML = '<p class="empty" style="margin:4px 0">Noch kein Aufruf.</p>'; return; }
  const t0 = Math.min(...sp.map(s => s.start)), t1 = Math.max(...sp.map(s => s.end), t0 + 1), span = t1 - t0;
  const pct = t => ((t - t0) / span * 100).toFixed(2) + '%';
  const step = [5, 10, 15, 30, 60, 120, 300, 600].find(x => span / x <= 8) || 1200;
  const ticks = []; for (let t = 0; t <= span; t += step) ticks.push(t);
  const fmt = t => t >= 60 ? `${Math.floor(t / 60)}:${String(Math.round(t % 60)).padStart(2, '0')} min` : `${t} s`;
  tl.innerHTML = sp.map(s => `<div class="tlrow ${s.k === selK ? 'sel' : ''}" data-k="${s.k}" data-a="${s.skript ? '' : s.id}">
      <span class="tlname">${esc(G.knoten[s.k].titel)}${s.runde > 1 ? ` <small>R${s.runde}</small>` : ''}</span>
      <div class="track"><div class="bar ${s.status} ${s.skript ? 'skript' : ''}" style="left:${pct(s.start)};width:calc(${pct(s.end)} - ${pct(s.start)})" title="${esc(s.text)}"></div>${
        (s.end - t0) / span < .72 ? `<span class="barlbl" style="left:calc(${pct(s.end)} + 6px)">${esc(s.text)}</span>` : `<span class="barlbl left" style="left:calc(${pct(s.start)} - 6px)">${esc(s.text)}</span>`}</div></div>`).join('')
    + `<div class="axis">${ticks.map(t => `<span style="left:${(t / span * 100).toFixed(2)}%">${fmt(t)}</span>`).join('')}</div>`;
}

function stationenVon(node) {

// Wo steht dieser Aufruf gerade? Abgeleitet aus Aufruf-Status, Stream und Knoten-Zustand.
function stationsZustand(k, node, calls, call) {
  const s = stateOf(k);
  if (!KI(node.art)) return { harness: s, ausgabe: s === 'run' ? 'wait' : s };
  const z = { prompt: 'wait', kontext: 'wait', aufruf: 'wait', ausgabe: 'wait', harness: 'wait' };
  if (!call) return z;
  const fertig = () => Object.assign(z, { prompt: 'ok', kontext: 'ok', aufruf: 'ok', ausgabe: 'ok' });
  if (call !== calls[calls.length - 1]) { fertig(); z.harness = 'ok'; return z; }   // ältere Runde
  z.prompt = z.kontext = 'ok';
  const text = !!D.live[call.id];
  if (call.status === 'run' && D.abgebrochen) { z.aufruf = text ? 'ok' : 'fail'; z.ausgabe = text ? 'fail' : 'wait'; }
  else if (call.status === 'run') { z.aufruf = text ? 'ok' : 'run'; z.ausgabe = text ? 'run' : 'wait'; }
  else if (call.status === 'fail') { z.aufruf = text ? 'ok' : 'fail'; z.ausgabe = text ? 'fail' : 'wait'; }
  else { fertig(); z.harness = s === 'wait' ? 'run' : s; }

}

    return esc(h ? h.text.replace(/ \(.*$/, '') : 'Harness arbeitet');

}

  // Oben: global starten oder abbrechen. Die Entscheidung über den angezeigten Lauf steht in einer eigenen Leiste darunter.
  const laeuft = !!(PZ && PZ.laeuft), offen = PZ && PZ.offen_live;
  $('startgruppe').hidden = laeuft; $('stopp').hidden = !laeuft;
  $('startLive').classList.toggle('gesperrt', !!offen);
  $('startLive').title = offen ? `Gesperrt: Der echte Lauf ${offen} wartet noch auf Freigabe oder Verwerfen` : 'Echter Lauf mit den Modellen aus config.json, kostet Guthaben';
  const letzt = D && D.events[D.events.length - 1];
  const demo = !!(D && D.start.quelle);
  const ende = demo && !laeuft && !!letzt && letzt.knoten === 'freigabe' && letzt.status === 'run';
  const wartet = !demo && !laeuft && !!D && runState()[0] === 'wait';
  const abgebrochen = !demo && !laeuft && !!letzt && letzt.knoten === 'orchestrator';   // eine Demo hinterlässt keinen Entwurf
  const leiste = $('entscheidung');
  leiste.hidden = !wartet && !abgebrochen && !ende;
  leiste.classList.toggle('abgebrochen', abgebrochen);
  leiste.classList.toggle('demo', ende);
  if (wartet || abgebrochen || ende) {
    const art = 'Echter Lauf';
    setHtml($('entscheidungText'), ende
      ? `<b>Demo zu Ende.</b> An dieser Stelle entscheidet im echten Lauf ein Mensch: Ergebnis prüfen, dann freigeben oder verwerfen.`
      : wartet
      ? `<b>${art} ${esc(current)} ist fertig.</b> Spiel das Ergebnis und entscheide: in <code>main</code> übernehmen oder verwerfen.`
      : `<b>${art} ${esc(current)} wurde abgebrochen.</b> Der halbe Entwurf liegt noch im Arbeitsbereich.`);
    $('play2').hidden = !(wartet || ende) || !D.ergebnis; $('play2').href = `/ergebnis/${current}/index.html`;
    $('freigabe').hidden = !wartet;
    $('verwerfen').hidden = ende;
    $('verwerfen').textContent = wartet ? '✕ Verwerfen' : '✕ Entwurf löschen';
  }
  if (wartet || ende) $('play').hidden = true;   // steht dann in der Leiste
  // Demo = Aufzeichnung abspielen. Ohne Aufzeichnung erklärt der Knopf, was fehlt.
  $('startDemo').classList.toggle('gesperrt', !AUFZ.length);
  $('startDemo').title = AUFZ.length ? `Spielt die Aufzeichnung von Lauf ${$('aufz').value} ab (${$('tempo').value}×), ohne Modelle und ohne Kosten` : 'Noch keine Aufzeichnung: Lass einmal einen echten Lauf bis zum Ende laufen';
  const fehler = PZ && !laeuft && PZ.code && !PZ.abgebrochen;
  $('startfehler').hidden = !fehler;
  if (fehler) $('startfehler').textContent = `Lauf mit Fehler beendet: ${PZ.letzte}`;
}
async function post(pfad, daten) {
  const r = await fetch(pfad, { method: 'POST', headers: { 'X-Dashboard': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(daten || {}) });
  if (r.status === 404) { alert('Das Dashboard läuft noch in einer älteren Version und kennt diese Aktion nicht. Starte den Task „1 Dashboard starten“ neu.'); return null; }
  if (!r.ok) { alert(r.status === 409 ? await r.text() : `Fehler ${r.status}: ${await r.text()}`); return null; }
  return r.json();
}
// ---------------------------------------------------------------- Demo-Aufzeichnungen
let AUFZ = [], aufzStand = 0;
const merke = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const erinnere = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
async function ladeAufzeichnungen() {
  AUFZ = await (await fetch('/api/aufzeichnungen')).json();
  aufzStand = Date.now();
  const sel = $('aufz'), vorher = sel.value || erinnere('demo-aufzeichnung');
  const min = s => s == null ? '' : ` · ${Math.max(1, Math.round(s / 60))} min`;
  setHtml(sel, AUFZ.map(a => `<option value="${a.id}">${a.id}${min(a.dauer)}${a.schleifen ? ' · mit Schleife' : ''}${a.ergebnis ? '' : ' · ohne Ergebnis'}</option>`).join(''));
  if (AUFZ.some(a => a.id === vorher)) sel.value = vorher;
}
async function starte(modus) {
  if (modus === 'demo' && !AUFZ.length) {
    alert('Noch keine Aufzeichnung. Lass einmal einen echten Lauf bis zum Ende laufen. Danach ist er hier als Demo abspielbar.');
    return;
  }
  const offen = modus === 'live' && PZ && PZ.offen_live;
  if (offen) {
    if (confirm(`Der echte Lauf ${offen} wartet noch auf deine Entscheidung. Erst danach startet ein neuer echter Lauf.\n\nZu diesem Lauf wechseln?`)) {
      switchRun(offen); follow = false; $('run').value = offen; tick();
    }
    return;
  }
  if (modus === 'live' && !confirm('Echter Lauf mit den Modellen aus config.json. Das kostet Guthaben bei den Anbietern. Starten?')) return;
  const z = await post('/api/start', modus === 'demo' ? { modus, quelle: $('aufz').value, tempo: +$('tempo').value } : { modus });
  if (!z) return;
  PZ = z; follow = true; detail = false; renderStart();   // Live folgen: Der neue Lauf erscheint von selbst
  tick();
}
async function entscheide(aktion) {
  const frage = aktion === 'freigabe'
    ? `Lauf ${current} freigeben? Sein Stand wird in arbeitsbereich/projekt der neue main. Eine frühere Freigabe bleibt in der Git-Historie.`
    : `Lauf ${current} verwerfen? Worktrees, Branches und das Ergebnis dieses Laufs werden gelöscht. Das Protokoll bleibt.`;
  if (!confirm(frage)) return;
  $('freigabe').disabled = $('verwerfen').disabled = true;
  const z = await post('/api/' + aktion, { lauf: current });
  $('freigabe').disabled = $('verwerfen').disabled = false;
  if (z && !z.ok) alert(`${aktion === 'freigabe' ? 'Freigabe' : 'Verwerfen'} fehlgeschlagen:\n${z.ausgabe}`);
  tick();
}
async function stoppe() {
  if (!confirm('Laufenden Lauf abbrechen?')) return;
  const z = await post('/api/stopp');
  if (z) { PZ = z; renderStart(); tick(); }
}

async function tick() {
  try {
    PZ = await (await fetch('/api/prozess')).json();
    renderStart();
    if (!G) {
      G = await (await fetch('/api/graph')).json();
    }
    const runs = await (await fetch('/api/runs')).json(), sel = $('run');
    if (sel.options.length !== runs.length || Date.now() - aufzStand > 15000) await ladeAufzeichnungen();
    if (sel.options.length !== runs.length) {
      sel.innerHTML = runs.map(r => `<option>${esc(r)}</option>`).join('');
      if (!current || follow) switchRun(runs[0]);
      sel.value = current;
    }
    if (!current) { $('zustand').innerHTML = '<span class="empty">Noch kein Lauf. Starte oben einen echten Lauf. Fertige echte Läufe kannst du danach als Demo abspielen.</span>'; return; }
    D = await (await fetch('/api/run/' + current)).json();
    D.start = D.start || {};
    D.abgebrochen = (D.events[D.events.length - 1] || {}).knoten === 'orchestrator';
    render();
  } catch (e) {
    console.error(e);
    $('zustand').innerHTML = '<span class="empty">Keine Verbindung. Läuft der Task „1 Dashboard starten“?</span>';
    $('zustand')._html = null;
  }
}
function switchRun(id) { current = id; selK = null; selA = null; detail = false; panelKey = outKey = logKey = ''; $('wall').dataset.key = ''; }
function setTeil(n) { teil = n; ansicht = 'graph'; detail = false; tab = null; erklaert = null; history.replaceState(null, '', n === 2 ? '#teil2' : '#teil1'); panelKey = logKey = ''; if (D) render(); }
function pick(k, a) {
  detail = !(detail && selK === k && !a);   // Zweiter Klick auf denselben Knoten klappt wieder zu
  selK = k; selA = a || null;
  if (D) render();
  if (detail) (ansicht === 'graph' ? $('graphbox') : $('panel')).scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function toggleErkl(id) { erklaert = erklaert === id ? null : id; if (erklaert && id !== 'graph' && tab !== id) tab = null; if (D) render(); }
function setTab(t) { tab = teil === 1 && tab === t ? null : t; if (teil === 1 && erklaert !== t) erklaert = null; if (D) render(); }

$('t1').onclick = () => setTeil(1);
$('t2').onclick = () => setTeil(2);
$('run').onchange = e => { switchRun(e.target.value); follow = e.target.selectedIndex === 0; tick(); };   // neuester Lauf: weiter folgen
$('tabs').onclick = e => { const i = e.target.closest('[data-erkl]'); if (i) return toggleErkl(i.dataset.erkl); const b = e.target.closest('[data-t]'); if (b) setTab(b.dataset.t); };
$('konzept').onclick = e => { const b = e.target.closest('[data-erkl]'); if (b) toggleErkl(b.dataset.erkl); };
$('ansicht').onclick = e => { if (e.target.dataset.a) { ansicht = e.target.dataset.a; if (D) render(); } };
$('stufen').onclick = e => { const b = e.target.closest('[data-k]'); if (b) return waehleAgent(b.dataset.k); const s = e.target.closest('[data-stufe]'); if (s) waehleStufe(+s.dataset.stufe); };
$('zu').onclick = () => { detail = false; if (D) render(); };
$('graphbox').onscroll = setzeZeiger;
$('startDemo').onclick = () => starte('demo');
$('startLive').onclick = () => starte('live');
$('stopp').onclick = stoppe;
$('aufz').onchange = e => { merke('demo-aufzeichnung', e.target.value); renderStart(); };
$('tempo').onchange = e => { merke('demo-tempo', e.target.value); renderStart(); };
$('tempo').value = ['1', '2', '4', '8'].includes(erinnere('demo-tempo')) ? erinnere('demo-tempo') : '2';
$('freigabe').onclick = () => entscheide('freigabe');
$('verwerfen').onclick = () => entscheide('verwerfen');
$('mehr').onclick = () => { const zu = $('laufbox').hidden; $('laufbox').hidden = !zu; $('mehr').setAttribute('aria-expanded', zu); };
$('rounds').onclick = e => { if (e.target.dataset.a) pick(selK, e.target.dataset.a); };
$('graph').onclick = e => { const g = e.target.closest('.node'); if (g) pick(g.dataset.k); };
$('wall').onclick = e => { const c = e.target.closest('.card'); if (c) pick(c.dataset.k, c.dataset.a); };
$('tl').onclick = e => { const r = e.target.closest('.tlrow'); if (r) pick(r.dataset.k, r.dataset.a || null); };
tick(); setInterval(tick, 700);
</script>
